<style>
    /* ১. ফুল ডিসপ্লে রাউন্ড বর্ডার (চুলের মতো চিকন) */
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* স্ক্রিন যেন নড়াচড়া না করে */
        background-color: black; /* ব্যাকগ্রাউন্ড কালো */
    }

    .living-border {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border: 1px solid rgba(255, 255, 255, 0.3); /* খুব চিকন সাদা বর্ডার */
        pointer-events: none; /* যাতে ক্লিকে বাধা না দেয় */
        z-index: 9999;
        border-radius: 20px; /* ফোনের রাউন্ড শেপ অনুযায়ী (পরিবর্তনযোগ্য) */
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        animation: breathe 4s infinite ease-in-out; /* জীবন্ত অনুভব */
    }

    /* ২. ব্রিদিং বা জীবন্ত অ্যানিমেশন */
    @keyframes breathe {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
    }

    /* ৩. কাজ শেষ হলে কালার "ধাপ" মারা (Action Pulse) */
    .border-pulse {
        border-color: #ffd700 !important; /* সোনালী কালার ধাপ */
        box-shadow: 0 0 20px #ffd700 !important;
    }

    /* ৪. ক্লিক করলে সোনালী ফোটা (Ripple Effect) */
    .click-dot {
        position: absolute;
        width: 15px;
        height: 15px;
        background: rgba(255, 215, 0, 0.7); /* সোনালী ফোটা */
        border-radius: 50%;
        transform: scale(0);
        animation: ripple 0.6s linear;
        pointer-events: none;
        z-index: 10000;
    }

    @keyframes ripple {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }
</style>

<div id="main-border" class="living-border"></div>

<script>
    // ৫. ক্লিকে সোনালী ফোটা এবং বর্ডার কালার পরিবর্তনের লজিক
    document.addEventListener('click', function(e) {
        // ফোটা তৈরি
        let dot = document.createElement('div');
        dot.classList.add('click-dot');
        dot.style.left = e.pageX - 7.5 + 'px';
        dot.style.top = e.pageY - 7.5 + 'px';
        document.body.appendChild(dot);

        // বর্ডারে "ধাপ" মারা
        const border = document.getElementById('main-border');
        border.classList.add('border-pulse');

        // নির্দিষ্ট সময় পর আগের অবস্থায় ফেরা
        setTimeout(() => {
            dot.remove();
            border.classList.remove('border-pulse');
        }, 600);
    });
</script>

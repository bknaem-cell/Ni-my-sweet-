<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDV System</title>
    <style>
        /* বেসিক স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* মোবাইলের ফ্রেম */
        .main-container {
            width: 360px;
            height: 640px;
            background-color: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
        }

        /* শিরোনাম */
        .title-tdv {
            text-align: center;
            font-size: 32px;
            color: #38bdf8;
            font-weight: bold;
            margin-top: 20px;
        }

        .subtitle-tdv {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* মেনু লিস্ট (1A, PIN, LOG) */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu-item {
            background-color: #0f172a;
            border: 1px solid #38bdf8;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .serial-box {
            background-color: #f43f5e;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        /* পিন কোডের বক্স */
        .pin-area {
            border: 1px dashed #f43f5e;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .pin-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .pin-stars {
            font-size: 24px;
            letter-spacing: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* ডায়মন্ড শেপ */
        .diamond-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .diamond {
            width: 20px;
            height: 20px;
            border: 2px solid #38bdf8;
            transform: rotate(45deg);
        }

        /* নিচের বাটন */
        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            width: 45%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .btn-no {
            background-color: #f43f5e;
            color: white;
        }

        .btn-ok {
            background-color: #10b981;
            color: white;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="title-tdv">TDV</div>
        <div class="subtitle-tdv">The Digital Villa</div>

        <div class="menu-list">
            <div class="menu-item">
                <span>সাইন আপ / নতুন মেম্বার</span>
                <span class="serial-box">1A</span>
            </div>
            <div class="menu-item">
                <span>সিকিউরিটি পিন কোড</span>
                <span class="serial-box">PIN</span>
            </div>
            <div class="menu-item">
                <span>মেম্বার লগইন গেট</span>
                <span class="serial-box">LOG</span>
            </div>
        </div>

        <div class="pin-area">
            <div class="pin-title">ENTER PIN</div>
            <div class="pin-stars">******</div>
        </div>

        <div class="diamond-group">
            <div class="diamond" style="background-color: #38bdf8;"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
            <div class="diamond"></div>
        </div>

        <div class="button-group">
            <button class="btn btn-no">NO</button>
            <button class="btn btn-ok">OK

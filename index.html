<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NI My Sweet - TDP Ultra</title>
    <style>
        :root { --blue: #0077ff; --dark: #000000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; }

        /* ১. সিস্টেম স্ট্যাটাস বার */
        .status-bar { height: 30px; padding: 5px 15px; display: flex; justify-content: space-between; font-size: 12px; background: #000; }

        /* ২. লোডিং স্ক্রিনে NI My Sweet ব্র্যান্ডিং ও রংধনু বার */
        #update-loader {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: systemExit 0.8s ease-in 5.5s forwards;
        }
        
        /* আপনার প্রজেক্ট ও সফটওয়্যারের নাম */
        .brand-container { text-align: center; margin-bottom: 25px; }
        .ni-text { font-size: 50px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 20px var(--blue); margin: 0; }
        .sweet-text { font-size: 16px; font-weight: 300; color: var(--blue); letter-spacing: 3px; text-transform: uppercase; margin-top: -5px; }
        
        /* মোটা রংধনু লোডিং বার */
        .bar-bg { 
            width: 280px; height: 15px; background: #1a1a1a; 
            border-radius: 20px; overflow: hidden; border: 1px solid #333; padding: 2px;
        }
        
        .bar-fill { 
            width: 0%; height: 100%; border-radius: 20px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: systemLoad 5s linear forwards, rainbow 2s linear infinite;
        }
        
        @keyframes systemLoad { 0% { width: 0; } 100% { width: 100%; } }
        @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes systemExit { to { opacity: 0; visibility: hidden; } }

        /* ৩. মূল ইন্টারফেস */
        #main-interface { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: uiEnter 1s 6s forwards; position: relative; }
        @keyframes uiEnter { to { opacity: 1; } }

        .auth-nav { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; }
        .auth-btn { background: transparent; color: #fff; border: 1.5px solid var(--blue); padding: 5px 15px; border-radius: 20px; font-size: 11px; }

        .layout-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .row { display: flex; gap: 12px; }
        .box { width: 85px; height: 50px; border: 2.5px solid #fff; border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: skewX(-18deg); background: rgba(255,255,255,0.05); }
        .txt-bold { font-size: 15px; font-weight: 800; }
        .txt-slim { font-size: 9px; font-weight: 300; color: var(--blue); }

        .center-hub { width: 100px; height: 100px; border: 3px solid var(--blue); transform: rotate(45deg); display: flex; justify-content: center; align-items: center; margin: 20px 0; box-shadow: 0 0 20px rgba(0, 119, 255, 0.4); }
        .center-hub span { transform: rotate(-45deg); font-size: 20px; font-weight: bold; }

        /* ৪. নেভিগেশন বার */
        .nav-footer { height: 50px; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; color: #444; }
    </style>
</head>
<body>

    <div class="status-bar"><div>১০:৪২ PM</div><div>📶 🔋 ৯০%</div></div>

    <div id="update-loader">
        <div class="brand-container">
            <h1 class="ni-text">NI</h1>
            <div class="sweet-text">My Sweet</div>
        </div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
    </div>

    <div id="main-interface">
        <div class="auth-nav">
            <button class="auth-btn">লগইন</button>
            <button class="auth-btn">সাইন আপ</button>
        </div>
        <div class="layout-container">
            <div class="row">
                <div class="box"><span class="txt-bold">1-A</span><span class="txt-slim">START</span></div>
                <div class="box"><span class="txt-bold">2-B</span><span class="txt-slim">ACCESS</span></div>
            </div>
            <div class="center-hub"><span>TDP</span></div>
            <div class="row">
                <div class="box"><span class="txt-bold">3-C</span><span class="txt-slim">DATA</span></div>
                <div class="box"><span class="txt-bold">4-D</span><span class="txt-slim">OK</span></div>
                <div class="box"><span class="txt-bold">5-E</span><span class="txt-slim">SYS</span></div>
            </div>
            <div class="row">
                <div class="box"><span class="txt-bold">6-F</span><span class="txt-slim">GLOBAL</span></div>
                <div class="box"><span class="txt-bold">7-G</span><span class="txt-slim">FARMER</span></div>
                <div class="box"><span class="txt-bold">8-H</span><span class="txt-slim">CORE</span></div>
            </div>
        </div>
    </div>

    <div class="nav-footer"><div>◀</div><div>●</div><div>■</div></div>
</body>
</html>

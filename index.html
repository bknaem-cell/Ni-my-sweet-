<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ni my sweet Elite</title>
    <style>
        /* পুরো ডিসপ্লে দখল করার জন্য স্টাইল */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', sans-serif; color: white;
        }

        .container { text-align: center; width: 100%; z-index: 10; }

        .brand {
            font-size: clamp(24px, 8vw, 48px); /* ফোন অনুযায়ী অটো সাইজ */
            font-weight: 900; text-transform: uppercase;
            letter-spacing: 5px; color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }

        .loader-box {
            width: 250px; height: 3px; background: #1a1a1a;
            margin: 0 auto; position: relative; border-radius: 10px;
        }
        .loader-bar {
            position: absolute; height: 100%; width: 0%;
            background: #ffffff; box-shadow: 0 0 10px #ffffff;
            transition: width 0.05s linear;
        }

        .status-text {
            margin-top: 15px; font-size: 10px; color: #555;
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* ক্লিক স্পার্ক */
        .spark {
            position: absolute; width: 4px; height: 4px;
            background: #ffffff; border-radius: 50%;
            box-shadow: 0 0 10px #00ffff; pointer-events: none;
            animation: burst 0.4s ease-out forwards;
        }
        @keyframes burst {
            to { transform: translate(-50%, -50%) scale(8); opacity: 0; }
        }
    </style>
</head>
<body onclick="launchEliteMode()">

    <div class="container">
        <div class="brand">Ni my sweet</div>
        <div class="loader-box">
            <div class="loader-bar" id="bar"></div>
        </div>
        <div id="status" class="status-text">চাপ দিয়ে সিস্টেম চালু করুন</div>
    </div>

    <script>
        function launchEliteMode() {
            // ১. পুরো ডিসপ্লে দখল করার কমান্ড (ক্রোম ব্রাউজারের বার লুকানোর জন্য)
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            // ২. ল্যান্ডস্কেপ ডিটেকশন ও লোডিং
            let width = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            
            const process = setInterval(() => {
                width++;
                bar.style.width = width + '%';
                
                if(width == 30) status.innerText = "সিস্টেম চেক হচ্ছে...";
                if(width == 70) status.innerText = "ফুল স্ক্রিন মুড অন হচ্ছে...";
                
                if (width >= 100) {
                    clearInterval(process);
                    status.innerText = "সিস্টেম অনলাইন";
                    status.style.color = "#00ffff";
                }
            }, 30);
        }

        // টাচ ইফেক্ট
        document.addEventListener('mousedown', (e) => {
            let s = document.createElement('div');
            s.className = 'spark';
            s.style.left = e.pageX + 'px'; s.style.top = e.pageY + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 400);
        });
    </script>
</body>
</html>

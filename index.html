<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ni my sweet - Universal System</title>
    <style>
        /* ১০,০০০ টাকার ফোনের প্রসেসরের ওপর চাপ কমাতে সিম্পল সিএসএস */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif; color: white;
        }

        /* ল্যান্ডস্কেপ মোড ওয়ার্নিং */
        #rotate-warning {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: #000;
            z-index: 10000; justify-content: center; align-items: center;
            text-align: center; color: #ffffff;
        }
        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex; }
        }

        .logo-container { text-align: center; width: 100%; }

        /* ক্লিন নাম - মাইনাস চিহ্ন ছাড়া */
        .logo-text {
            font-size: 38px; font-weight: bold; letter-spacing: 8px;
            color: #ffffff; text-transform: uppercase; margin-bottom: 35px;
        }

        /* সুপার ফাস্ট লোডিং বার (বাজেট ফ্রেন্ডলি) */
        .progress-wrapper {
            width: 280px; height: 3px; background: #222;
            margin: 0 auto; position: relative; border-radius: 2px;
        }
        .progress-bar {
            position: absolute; height: 100%; width: 0%;
            background: #ffffff;
            transition: width 0.03s linear; 
        }

        .status {
            margin-top: 15px; font-size: 10px; color: #888;
            letter-spacing: 2px;
        }

        /* ছোট এবং শার্প ক্লিক ইফেক্ট */
        .spark {
            position: absolute; width: 4px; height: 4px;
            background: #ffffff; border-radius: 50%;
            box-shadow: 0 0 8px #ffffff; pointer-events: none;
            animation: fade 0.3s ease-out forwards;
            z-index: 9999;
        }
        @keyframes fade {
            to { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
    </style>
</head>
<body onclick="start()">

    <div id="rotate-warning">
        <div>
            <div style="font-size: 30px;">🔄</div>
            <p>ROTATE TO LANDSCAPE</p>
        </div>
    </div>

    <div class="logo-container">
        <div class="logo-text">Ni my sweet</div>
        <div class="progress-wrapper">
            <div class="progress-bar" id="bar"></div>
        </div>
        <div id="logs" class="status">TOUCH TO INITIALIZE</div>
    </div>

    <script>
        function start() {
            // ফুল স্ক্রিন রিকোয়েস্ট
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();

            let w = 0;
            const b = document.getElementById('bar');
            const l = document.getElementById('logs');
            
            const run = setInterval(() => {
                w++;
                b.style.width = w + '%';
                
                if(w == 20) l.innerText = "CONNECTING...";
                if(w == 60) l.innerText = "SYNCING...";
                if(w == 90) l.innerText = "FINISHING...";

                if (w >= 100) {
                    clearInterval(run);
                    l.innerText = "SYSTEM ACTIVE";
                    l.style.color = "#ffffff";
                }
            }, 30); // দ্রুত এবং স্মুথ লোডিং
        }

        // টাচ ইফেক্ট - ব্যাটারি সাশ্রয়ী
        document.addEventListener('mousedown', (e) => {
            let s = document.createElement('div');
            s.className = 'spark';
            s.style.left = e.pageX + 'px'; s.style.top = e.pageY + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 300);
        });
    </script>
</body>
</html>

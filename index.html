<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NI MY SWEET - Global Edition</title>
    <style>
        /* স্যামসাং স্টাইল পিওর ব্ল্যাক ব্যাকগ্রাউন্ড */
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            cursor: pointer;
        }

        /* অতি সূক্ষ্ম বর্ডার - একদম ডিসপ্লের প্রান্তে */
        .edge-glow {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 9999;
            box-sizing: border-box;
            border: 0.1px solid rgba(255, 255, 255, 0.15); /* চুলের মতো চিকন সাদাটে আভা */
            box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .main-content { text-align: center; width: 340px; }

        /* স্যামসাং আপডেট স্টাইল - শার্প সাদা টেক্সট */
        .brand {
            color: #ffffff; 
            font-size: 22px; /* আধুনিক ও মাঝারি সাইজ */
            font-weight: 300; /* হালকা ও মার্জিত */
            margin-bottom: 35px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.95;
        }

        /* প্রগ্রেস বার - আরও চিকন ও আধুনিক */
        .bar-bg { 
            height: 3px; /* একদম চিকন আধুনিক বার */
            width: 100%; 
            background: #222; 
            border-radius: 10px; 
            overflow: hidden; 
        }

        .bar-fill {
            height: 100%; width: 0%;
            background: #ffffff; /* পিওর হোয়াইট প্রগ্রেস */
            animation: load 3s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes load { to { width: 100%; } }

        .next-btn { 
            color: #888; 
            margin-top: 20px; 
            font-size: 10px; 
            letter-spacing: 10px; 
            text-transform: uppercase;
        }
    </style>
</head>
<body onclick="launchGameMode()">

    <div class="edge-glow"></div>

    <div class="main-content">
        <div class="brand">NI MY SWEET</div>
        <div class="bar-bg">
            <div class="bar-fill"></div>
        </div>
        <div class="next-btn">System Processing</div>
    </div>

    <script>
        async function launchGameMode() {
            let el = document.documentElement;
            if (el.requestFullscreen) { await el.requestFullscreen(); }
            
            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } catch (e) {}
            }
        }
    </script>
</body>
</html>

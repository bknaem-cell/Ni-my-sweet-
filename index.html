<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>TDP System - Naeem Ibrahim</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* ১. স্ট্যাটাস ও নেভিগেশন বার */
        .bar { background: rgba(0,0,0,0.9); padding: 5px 15px; font-size: 11px; display: flex; justify-content: space-between; }
        .nav-bar { height: 45px; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; }

        /* ২. ৫ সেকেন্ডের লোডিং এনিমেশন */
        #loading-screen { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; animation: fadeOut 0.5s 5s forwards; }
        .progress-bar { width: 200px; height: 2px; background: #333; margin-top: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: #0077ff; animation: fill 5s linear forwards; }
        @keyframes fill { from { width: 0; } to { width: 100%; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* ৩. স্কেচ লেআউট */
        #content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: fadeIn 1s 5s forwards; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .box { width: 80px; height: 50px; border: 2px solid #fff; border-radius: 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: skewX(-20deg); font-weight: bold; font-size: 12px; }
        .bold-text { font-size: 14px; font-weight: 800; }
        .slim-text { font-size: 10px; font-weight: 300; }
        .center-hub { width: 100px; height: 100px; border: 3px solid #0077ff; transform: rotate(45deg); display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .center-hub span { transform: rotate(-45deg); font-weight: bold; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="bar"><span>১০:৪২ PM</span><span>📶 🔋 ৯০%</span></div>

    <div id="loading-screen">
        <div style="color: #0077ff;">SYSTEM INITIALIZING...</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <div id="content">
        <div style="position:absolute; top:40px; font-size:10px; color:#0077ff;">CATEGORY: 1-A</div>
        <div class="row"><div class="box"><span class="bold-text">1-A</span><span class="slim-text">START</span></div><div class="box"><span class="bold-text">2-B</span><span class="slim-text">LOGIN</span></div></div>
        <div class="center-hub"><span>TDP</span></div>
        <div class="row"><div class="box"><span class="bold-text">3-C</span><span class="slim-text">DATA</span></div><div class="box"><span class="bold-text">4-D</span><span class="slim-text">OK</span></div><div class="box"><span class="bold-text">5-E</span><span class="slim-text">NO</span></div></div>
    </div>

    <div class="nav-bar"><div>◄</div><div>●</div><div>■</div></div>
</body>
</html></body>
</html>

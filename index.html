<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NI MY SWEET - Python Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
        }

        /* প্রিমিয়াম সায়ান বর্ডার */
        .edge-border {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 9999;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 1s ease-in-out;
        }

        .main-content { 
            text-align: center; 
            width: 100%; 
            max-width: 500px; /* ল্যান্ডস্কেপে লেখা ছড়িয়ে পড়া রোধ করবে */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* স্যামসাং স্টাইল বোল্ড টেক্সট - অতিরিক্ত ফাঁকা কমানো হয়েছে */
        .brand {
            color: #ffffff; 
            font-size: clamp(24px, 5vw, 40px); /* স্ক্রিন অনুযায়ী অটো সাইজ হবে */
            font-weight: 900; 
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* মোটা লোডিং বক্স - আপনার ছবি অনুযায়ী মাঝখানে ফিক্স করা */
        .bar-container { 
            position: relative;
            height: 24px; 
            width: 80%; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bar-fill { height: 100%; width: 0%; background: #ffffff; box-shadow: 0 0 10px #fff; }

        .percent-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff; mix-blend-mode: difference;
            font-size: 12px; font-weight: 900;
        }
    </style>
</head>
<body onclick="launchSystem()">
    <div id="glow-border" class="edge-border"></div>
    <div class="main-content">
        <div class="brand">NI MY SWEET</div>
        <div class="bar-container">
            <div class="percent-text" id="p-val">0%</div>
            <div class="bar-fill" id="p-bar"></div>
        </div>
    </div>

    <script>
        async function launchSystem() {
            let el = document.documentElement;
            if (el.requestFullscreen) await el.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape').catch(e => {});
            }
        }

        let progress = 0;
        const pBar = document.getElementById('p-bar');
        const pVal = document.getElementById('p-val');

        const loading = setInterval(() => {
            progress += 1;
            pBar.style.width = progress + "%";
            pVal.innerText = progress + "%";
            if (progress >= 100) {
                clearInterval(loading);
                document.getElementById('glow-border').style.borderColor = "rgba(0, 255, 255, 0.8)";
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }, 30);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TDV - PREMIER VIRTUAL LOBBY</title>
    <style>
        :root { --neon: #00ff41; --dark-bg: #050a12; --glow: rgba(0, 255, 65, 0.3); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); color: white; }

        /* ফিউচারিস্টিক ডাইনামিক গ্রিড ব্যাকগ্রাউন্ড */
        .lobby-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a1f14 0%, var(--dark-bg) 80%);
            z-index: 1; overflow: hidden;
        }
        .grid-lines {
            position: absolute; width: 200%; height: 200%;
            background-image: linear-gradient(var(--glow) 1px, transparent 1px),
                              linear-gradient(90deg, var(--glow) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 20s linear infinite;
            bottom: -50%; left: -50%; z-index: 1; opacity: 0.5;
        }
        @keyframes moveGrid { from { transform: perspective(500px) rotateX(60deg) translateY(0); } to { transform: perspective(500px) rotateX(60deg) translateY(50px); } }

        /* আপনার স্কেচ অনুযায়ী টপ প্রিমিয়াম আইডি কার্ড */
        .top-panel {
            position: absolute; top: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; z-index: 10;
        }
        .id-card {
            background: rgba(0, 0, 0, 0.6); border-left: 4px solid var(--neon);
            padding: 12px 20px; border-radius: 5px; backdrop-filter: blur(10px);
            box-shadow: 0 0 15px var(--glow);
        }
        .id-card h1 { font-size: 16px; letter-spacing: 2px; color: var(--neon); }
        .id-card p { font-size: 10px; color: #aaa; margin-top: 3px; }

        .wallet-display {
            background: rgba(0, 255, 65, 0.1); border: 1px solid var(--neon);
            padding: 10px 20px; border-radius: 30px; text-align: right;
            box-shadow: inset 0 0 10px var(--glow);
        }
        .wallet-display span { font-size: 20px; font-weight: bold; color: var(--neon); }

        /* মাঝখানের থ্রিডি লোগো এরিয়া (TDV) */
        .central-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 5; text-align: center;
        }
        .tdv-logo-glow {
            font-size: 80px; font-weight: 900; color: transparent;
            -webkit-text-stroke: 1px var(--neon);
            text-shadow: 0 0 30px var(--neon);
            opacity: 0.2; letter-spacing: 15px;
        }

        /* ফ্লোটিং অ্যাকশন বাটনসমূহ (আপনার স্কেচের বাটনগুলো) */
        .floating-controls {
            position: absolute; bottom: 40px; left: 20px; right: 20px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; z-index: 10;
        }
        .neon-btn {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--neon);
            padding: 20px 10px; border-radius: 15px; text-align: center;
            transition: 0.4s; cursor: pointer; position: relative;
            overflow: hidden;
        }
        .neon-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .neon-btn:hover::before { left: 100%; }
        .neon-btn:active { transform: scale(0.9); box-shadow: 0 0 20px var(--neon); }
        .neon-btn i { font-size: 28px; display: block; margin-bottom: 8px; color: var(--neon); }
        .neon-btn span { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #fff; }

        /* সাইড শর্টকাট (আপনার স্কেচের নম্বর দেওয়া বাটনগুলো) */
        .side-icons {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 10;
        }
        .hex-icon {
            width: 45px; height: 45px; background: var(--dark-bg); border: 1.5px solid var(--neon);
            display: flex; align-items: center; justify-content: center; border-radius: 10px;
            transform: rotate(45deg); box-shadow: 0 0 10px var(--glow);
        }
        .hex-icon i { transform: rotate(-45deg); font-size: 20px; color: var(--neon); }
    </style>
</head>
<body>

    <div class="lobby-bg">
        <div class="grid-lines"></div>
    </div>

    <div class="central-hub">
        <div class="tdv-logo-glow">TDV</div>
        <p style="color: var(--neon); letter-spacing: 5px; font-size: 12px; margin-top: -20px;">SYSTEM ACTIVE</p>
    </div>

    <div class="top-panel">
        <div class="id-card">
            <h1>নাঈম ইব্রাহিম</h1>
            <p>RANK: LEVEL 1 PLAYER | UID: BD-0001</p>
        </div>
        <div class="wallet-display">
            <p style="font-size: 9px; color: #aaa;">AVAILABLE ASSETS</p>
            <span>৳ ০.০০</span>
        </div>
    </div>

    <div class="side-icons">
        <div class="hex-icon"><i>⚙️</i></div>
        <div class="hex-icon"><i>🔔</i></div>
        <div class="hex-icon"><i>💬</i></div>
    </div>

    <div class="floating-controls">
        <div class="neon-btn" onclick="alert('বন্যা সিস্টেমের বিস্তার ম্যাপ লোড হচ্ছে...')">
            <i>🏗️</i><span>বিল্ডার</span>
        </div>
        <div class="neon-btn" onclick="alert('গ্রামের ডিজিটাল মার্কেট কানেক্টিং...')">
            <i>🏪</i><span>দোকান</span>
        </div>
        <div class="neon-btn" onclick="alert('রিয়েল-টাইম ডেলিভারি ট্র্যাকিং...')">
            <i>🛵</i><span>কুরিয়ার</span>
        </div>
        <div class="neon-btn" onclick="alert('ইউজার প্রোফাইল ও সেটিংস...')">
            <i>👤</i><span>প্রোফাইল</span>
        </div>
    </div>

</body>
</html>

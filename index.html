<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ni my sweet Smart System</title>
    <style>
        /* AMOLED ব্ল্যাক ব্যাকগ্রাউন্ড */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif; color: white;
        }

        .container {
            text-align: center;
            width: 100%;
            transition: all 0.5s ease; /* পজিশন পরিবর্তনের স্মুথ ট্রানজিশন */
        }

        .brand {
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
            transition: font-size 0.3s ease;
        }

        /* লোডিং বার */
        .load-box {
            height: 3px;
            background: #1a1a1a;
            margin: 0 auto;
            position: relative;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .load-bar {
            position: absolute; height: 100%; width: 0%;
            background: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }

        .status {
            margin-top: 20px;
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ক্লিক স্পার্ক */
        .click {
            position: absolute; width: 4px; height: 4px;
            background: #ffffff; border-radius: 50%;
            box-shadow: 0 0 10px #00ffff; pointer-events: none;
            animation: out 0.4s ease-out forwards;
            z-index: 9999;
        }
        @keyframes out {
            to { transform: translate(-50%, -50%) scale(6); opacity: 0; }
        }
    </style>
</head>
<body onclick="smartLaunch()">

    <div class="container" id="main-ui">
        <div class="brand" id="logo">Ni my sweet</div>
        <div class="load-box" id="box">
            <div class="load-bar" id="bar"></div>
        </div>
        <div id="status" class="status">TOUCH TO INITIALIZE</div>
    </div>

    <script>
        function smartLaunch() {
            const logo = document.getElementById('logo');
            const box = document.getElementById('box');
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');

            // ১. ইউজার ফোনটি কীভাবে ধরেছে তা চেক করা
            if (window.innerHeight > window.innerWidth) {
                // সোজা পজিশন (Portrait)
                logo.style.font_size = "28px";
                box.style.width = "70%";
            } else {
                // বাঁকা পজিশন (Landscape)
                logo.style.font_size = "45px";
                box.style.width = "400px";
                
                // গেমের মতো ফুল স্ক্রিন রিকোয়েস্ট
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            }

            // ২. লোডিং শুরু করা
            let w = 0;
            const timer = setInterval(() => {
                w++;
                bar.style.width = w + '%';
                
                if(w == 30) status.innerText = "DETECTING DEVICE...";
                if(w == 70) status.innerText = "SYNCING INTERFACE...";
                
                if (w >= 100) {
                    clearInterval(timer);
                    status.innerText = "SYSTEM ACTIVE";
                    status.style.color = "#00ffff";
                }
            }, 30);
        }

        // টাচ ইফেক্ট
        document.addEventListener('mousedown', (e) => {
            let c = document.createElement('div');
            c.className = 'click';
            c.style.left = e.pageX + 'px'; c.style.top = e.pageY + 'px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 400);
        });
    </script>
</body>
</html>

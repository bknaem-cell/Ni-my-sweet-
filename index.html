<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ni-My-Sweet: 3D Globe & Library</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #cesiumContainer { width: 100%; height: 100vh; }
        .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
        .btn { padding: 12px 20px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lib-btn { background: #673AB7; position: absolute; top: 15px; left: 15px; z-index: 100; }
        .home-btn { background: #4CAF50; }
        /* লাইব্রেরি প্যানেল */
        #libraryPanel { display: none; position: absolute; top: 70px; left: 15px; width: 280px; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 10px; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <button class="btn lib-btn" onclick="toggleLibrary()">📚 লাইব্রেরি</button>

    <div id="libraryPanel">
        <h3 style="margin-top:0; color:#673AB7;">পণ্য ট্র্যাকিং লাইব্রেরি</h3>
        <p><b>কোড: নাঈম ১৮</b></p>
        <hr>
        <ul id="deliveryList" style="padding-left: 20px; font-size: 14px;">
            <li>📦 ধান - গন্তব্য: ঢাকা (প্রক্রিয়াধীন)</li>
            <li>📦 সবজি - গন্তব্য: বাজার (সম্পন্ন)</li>
        </ul>
        <button onclick="toggleLibrary()" style="width:100%; padding:5px; margin-top:10px;">বন্ধ করুন</button>
    </div>

    <div id="cesiumContainer"></div>

    <div class="controls">
        <button class="btn home-btn" onclick="zoomToHome()">🏠 ঘর তৈরি</button>
    </div>

    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            baseLayerPicker: false, geocoder: false, homeButton: false, animation: false, timeline: false
        });

        function toggleLibrary() {
            var panel = document.getElementById("libraryPanel");
            if (panel.style.display === "none" || panel.style.display === "") {
                panel.style.display = "block";
            } else {
                panel.style.display = "none";
            }
        }

        function zoomToHome() {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(lon, lat, 400),
                    orientation: { pitch: Cesium.Math.toRadians(-45.0) }
                });
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ni My Sweet - Elite System</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none;
        }

        /* রোটেশন আইকন - একদম নিচে মাঝ বরাবর */
        #rotate-icon {
            position: fixed; 
            bottom: 40px; /* নিচ থেকে সঠিক দূরত্ব */
            left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 50px; 
            background: rgba(255,255,255,0.08);
            border-radius: 50%; display: none; justify-content: center;
            align-items: center; border: 1.5px solid rgba(255,255,255,0.6);
            animation: pulse 2s infinite; z-index: 999;
            font-size: 24px;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(1.15); opacity: 1; }
            100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
        }

        .master-container {
            text-align: center; width: 90%;
            display: flex; flex-direction: column; align-items: center;
        }

        /* আপনার দেওয়া সঠিক নাম ফরম্যাট */
        .brand-name {
            font-size: clamp(30px, 10vw, 50px);
            font-weight: 700; margin-bottom: 30px;
            color: #ffffff; letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .loader-box {
            width: 100%; max-width: 320px; height: 3px;
            background: #111; position: relative; border-radius: 10px;
        }

        .loader-fill {
            position: absolute; height: 100%; width: 0%;
            background: #fff; box-shadow: 0 0 15px #fff;
            transition: width 0.05s linear;
        }

        .status-info {
            margin-top: 20px; font-size: 12px; color: #00ffff;
            letter-spacing: 3px; text-transform: uppercase; font-weight: bold;
        }
    </style>
</head>
<body onclick="launchEliteSystem()">

    <div id="rotate-icon">🔄</div>

    <div class="master-container">
        <div class="brand-name">Ni My Sweet</div>
        <div class="loader-box">
            <div class="loader-fill" id="bar"></div>
        </div>
        <div id="status" class="status-info">TOUCH TO SYNC</div>
    </div>

    <script>
        // রোটেশন ডিটেকশন
        window.addEventListener("orientationchange", function() {
            const icon = document.getElementById('rotate-icon');
            icon.style.display = "flex";
            setTimeout(() => { icon.style.display = "none"; }, 5000); // ৫ সেকেন্ড থাকবে
        });

        function launchEliteSystem() {
            let doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            
            let w = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            
            const timer = setInterval(() => {
                w++;
                bar.style.width = w + '%';
                if(w == 40) status.innerText = "ALIGING CENTER...";
                if(w == 80) status.innerText = "SYSTEM OPTIMIZED...";
                
                if (w >= 100) {
                    clearInterval(timer);
                    status.innerText = "SYSTEM ACTIVE";
                }
            }, 30);
        }
    </script>
</body>
</html>

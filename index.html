<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ni-my-sweet- System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ল্যান্ডস্কেপ মুড অটোমেশন */
        @media screen and (orientation: portrait) {
            body { transform: rotate(0deg); }
        }

        .container {
            text-align: center;
        }

        .text {
            color: white;
            font-size: 35px;
            font-family: Arial, sans-serif;
            margin-bottom: 30px;
            letter-spacing: 8px;
            font-weight: bold;
            text-transform: none; /* আপনার অরিজিনাল ছোট হাতের অক্ষর ঠিক রাখার জন্য */
        }

        .loading-box {
            width: 350px;
            height: 30px;
            border: 2px solid white;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-bar {
            height: 100%;
            background-color: white;
            width: 0%;
            position: absolute;
            left: 0;
            top: 0;
            animation: load 5s linear forwards;
        }

        .percent-text {
            color: white;
            font-size: 14px;
            font-family: Arial, sans-serif;
            z-index: 2;
            mix-blend-mode: difference;
            font-weight: bold;
        }

        @keyframes load {
            to { width: 100%; }
        }

        .click-glow {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: glow-out 0.6s ease-out forwards;
            box-shadow: 0 0 15px 5px rgba(0, 255, 255, 0.5);
            z-index: 9999;
        }

        @keyframes glow-out {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text">Ni-my-sweet-</div> 
        <div class="loading-box">
            <div class="loading-bar"></div>
            <div class="percent-text" id="percent">0%</div>
        </div>
    </div>

    <script>
        let percentElement = document.getElementById('percent');
        let count = 0;
        let interval = setInterval(() => {
            count++;
            percentElement.innerText = count + '%';
            if (count >= 100) clearInterval(interval);
        }, 50);

        document.addEventListener('click', function(e) {
            let glow = document.createElement('div');
            glow.className = 'click-glow';
            glow.style.left = e.pageX + 'px';
            glow.style.top = e.pageY + 'px';
            document.body.appendChild(glow);
            setTimeout(() => { glow.remove(); }, 600);
        });
    </script>
</body>
</html>

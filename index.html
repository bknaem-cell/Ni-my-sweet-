<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NI My Sweet - Pro System</title>
    <style>
        /* আগের সব স্টাইল থাকবে... */
        :root { --blue: #0077ff; --dark: #000000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--dark); color: #fff; overflow: hidden; display: flex; flex-direction: column; font-family: sans-serif; }

        /* লোডিং স্ক্রিন ও রংধনু বার */
        #update-loader {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        .ni-title { font-size: 50px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--blue); margin-bottom: 20px; }
        
        .bar-container { width: 280px; height: 16px; background: #111; border-radius: 20px; border: 1.5px solid #333; padding: 2px; }
        .bar-progress { 
            width: 0%; height: 100%; border-radius: 20px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
        }

        /* মূল ইন্টারফেস যেখানে আপনার বাটনগুলো আছে */
        #main-ui { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body onclick="startSystem()">

    <div id="update-loader">
        <div class="ni-title">NI My Sweet</div>
        <div class="bar-container"><div class="bar-progress" id="progress"></div></div>
        <p style="font-size: 10px; color: #444; margin-top: 10px;">সিস্টেম লোড হচ্ছে... স্ক্রিনে একবার ক্লিক করুন</p>
    </div>

    <div id="main-ui">
        <div style="display: flex; gap: 40px; margin-bottom: 50px;">
            <button style="border:1px solid var(--blue); background:none; color:#fff; padding:10px 25px; border-radius:20px;">লগইন</button>
            <button style="border:1px solid var(--blue); background:none; color:#fff; padding:10px 25px; border-radius:20px;">সাইন আপ</button>
        </div>
        <p>সিস্টেম অনলাইন</p>
    </div>

    <script>
        let systemInitialized = false;

        function startSystem() {
            if (systemInitialized) return;
            systemInitialized = true;
            
            let prog = document.getElementById('progress');
            let width = 0;
            
            let interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    completeLoading();
                } else {
                    width++;
                    prog.style.width = width + '%';
                }
            }, 50); // ৫ সেকেন্ড লোডিং সময়
        }

        function completeLoading() {
            // ১. সাউন্ড প্লে করা
            playSuccessSound();
            
            // ২. ভাইব্রেশন (যদি মোবাইল ডিভাইস হয়)
            if (navigator.vibrate) {
                navigator.vibrate(200); // ২০০ মিলি সেকেন্ড ভাইব্রেশন
            }

            // ৩. স্ক্রিন পরিবর্তন
            setTimeout(() => {
                document.getElementById('update-loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('update-loader').style.display = 'none';
                    document.getElementById('main-ui').style.display = 'flex';
                }, 800);
            }, 500);
        }

        function playSuccessSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5 note
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6 note
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    </script>
</body>
</html>

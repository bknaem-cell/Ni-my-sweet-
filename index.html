<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NI My Sweet - Master Project</title>
    <style>
        :root { --blue: #0077ff; --dark: #000000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--dark); color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }

        /* লোডিং স্ক্রিন */
        #loading-page { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .brand { font-size: 40px; font-weight: 900; text-shadow: 0 0 15px var(--blue); margin-bottom: 20px; }
        .bar-box { width: 280px; height: 16px; background: #111; border-radius: 20px; border: 1.5px solid #333; overflow: hidden; padding: 2px; }
        #progress-bar { 
            width: 0%; height: 100%; border-radius: 20px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%; animation: rainbow 2s linear infinite;
        }
        @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* মূল ইন্টারফেস */
        #app-content { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .sketch-box { width: 90px; height: 50px; border: 2px solid #fff; transform: skewX(-15deg); display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(255,255,255,0.05); margin: 10px; cursor: pointer; transition: 0.2s; }
        .sketch-box:active { transform: skewX(-15deg) scale(0.9); border-color: var(--blue); }
        .center-tdp { width: 100px; height: 100px; border: 3px solid var(--blue); transform: rotate(45deg); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px var(--blue); margin: 30px 0; }
        .center-tdp span { transform: rotate(-45deg); font-weight: 900; }
    </style>
</head>
<body onclick="initApp()">

    <div id="loading-page">
        <div class="brand">NI My Sweet</div>
        <div class="bar-box"><div id="progress-bar"></div></div>
        <p style="font-size: 10px; color: #555; margin-top: 15px;">শুরু করতে স্ক্রিনে একবার ক্লিক করুন</p>
    </div>

    <div id="app-content">
        <div style="display: flex; gap: 20px;">
            <div class="sketch-box" onclick="vibratePhone()"><b>1-A</b><span style="font-size: 8px;">START</span></div>
            <div class="sketch-box" onclick="vibratePhone()"><b>2-B</b><span style="font-size: 8px;">ACCESS</span></div>
        </div>
        <div class="center-tdp"><span>TDP</span></div>
        <div style="display: flex; gap: 20px;">
            <div class="sketch-box" onclick="vibratePhone()"><b>3-C</b><span style="font-size: 8px;">DATA</span></div>
            <div class="sketch-box" onclick="vibratePhone()"><b>4-D</b><span style="font-size: 8px;">OK</span></div>
        </div>
    </div>

    <script>
        let started = false;
        function initApp() {
            if (started) return;
            started = true;
            let bar = document.getElementById('progress-bar');
            let w = 0;
            let interval = setInterval(() => {
                if (w >= 100) {
                    clearInterval(interval);
                    finishLoading();
                } else {
                    w++; bar.style.width = w + '%';
                }
            }, 40);
        }

        function finishLoading() {
            if (navigator.vibrate) navigator.vibrate(200);
            playTone();
            setTimeout(() => {
                document.getElementById('loading-page').style.display = 'none';
                document.getElementById('app-content').style.display = 'flex';
            }, 500);
        }

        function vibratePhone() { if (navigator.vibrate) navigator.vibrate(50); playTone(); }

        function playTone() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        }
    </script>
</body>
</html>

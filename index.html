<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ni My Sweet - Elite Legacy</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none;
        }

        /* ১. ফোন সোজা থাকলে এই স্ক্রিনটি দেখাবে (Orientation Lock) */
        #orientation-blocker {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        .phone-icon {
            font-size: 60px; margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* ২. মূল গেম ইন্টারফেস (শুরুতে লুকানো থাকবে) */
        #game-interface {
            display: none; width: 100%; height: 100%;
            justify-content: center; align-items: center;
            flex-direction: column;
        }

        /* উপরের ফিক্সড লোগো */
        #top-logo {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px; background: rgba(255,255,255,0.05);
            border-radius: 50%; border: 1.5px solid rgba(0,255,255,0.3);
            display: flex; justify-content: center; align-items: center; font-size: 24px;
        }

        .brand-name {
            font-size: clamp(35px, 12vw, 65px);
            font-weight: 800; text-shadow: 0 0 30px #fff;
            letter-spacing: 3px; margin-bottom: 20px;
        }

        .loading-bar-container {
            width: 300px; height: 2px; background: #111; position: relative;
        }

        .loading-bar-fill {
            height: 100%; width: 0%; background: #fff;
            box-shadow: 0 0 20px #fff; transition: width 0.1s linear;
        }

        .status-msg {
            margin-top: 25px; color: #00ffff; font-size: 10px;
            letter-spacing: 4px; font-weight: bold;
        }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div id="orientation-blocker">
        <div class="phone-icon">📱</div>
        <p style="letter-spacing: 2px;">PLEASE ROTATE YOUR DEVICE</p>
        <p style="font-size: 10px; color: #555;">FOR THE BEST PROFESSIONAL EXPERIENCE</p>
    </div>

    <div id="game-interface">
        <div id="top-logo">🔄</div>
        <div class="brand-name">Ni My Sweet</div>
        <div class="loading-bar-container">
            <div class="loading-bar-fill" id="progress"></div>
        </div>
        <div id="status" class="status-msg">SYSTEM STANDBY</div>
    </div>

    <script>
        function checkOrientation() {
            const blocker = document.getElementById('orientation-blocker');
            const game = document.getElementById('game-interface');

            // ফোন যদি আড়াআড়ি (Landscape) থাকে
            if (window.innerWidth > window.innerHeight) {
                blocker.style.display = 'none';
                game.style.display = 'flex';
                startLoading();
            } else {
                blocker.style.display = 'flex';
                game.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('load', checkOrientation);

        function requestFullscreen() {
            let doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
        }

        let isLoaded = false;
        function startLoading() {
            if(isLoaded) return;
            isLoaded = true;
            
            let p = 0;
            const bar = document.getElementById('progress');
            const status = document.getElementById('status');
            
            const timer = setInterval(() => {
                p++;
                bar.style.width = p + '%';
                if(p == 30) status.innerText = "ALIGING HARDWARE...";
                if(p == 70) status.innerText = "ESTABLISHING LEGACY...";
                if(p >= 100) {
                    clearInterval(timer);
                    status.innerText = "SYSTEM ACTIVE";
                    status.style.color = "#00ff00";
                }
            }, 40);
        }
    </script>
</body>
</html>

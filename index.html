<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NI MY SWEET - Gaming Pro</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial', sans-serif;
            cursor: pointer;
        }

        /* প্রিমিয়াম এজ গ্লো - যা আপনার স্ক্রিনে দেখা যাচ্ছে */
        .edge-glow {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 9999;
            box-sizing: border-box;
            border: 2px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.4);
        }

        /* পোর্ট্রেট মোডে থাকলে সতর্কতা */
        #rotate-notice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff; z-index: 10001;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-size: 18px;
        }

        @media screen and (orientation: portrait) {
            #rotate-notice { display: flex; }
        }

        .main-content { text-align: center; width: 340px; }
        .brand {
            color: #ffffff; font-size: 32px; font-weight: 800; margin-bottom: 25px;
            letter-spacing: 4px; text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .bar-bg { height: 14px; width: 100%; background: #111; border-radius: 20px; overflow: hidden; }
        .bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff0000, #ffbb00, #44ff00, #00ffff, #0044ff);
            background-size: 300% 100%; animation: load 3s forwards linear;
        }

        @keyframes load { to { width: 100%; } }
        .next-btn { color: #fff; margin-top: 15px; font-size: 12px; letter-spacing: 8px; opacity: 0.7; }
    </style>
</head>
<body onclick="launchGameMode()">

    <div id="rotate-notice">
        <p>🔄 Please Rotate Your Device</p>
        <span style="font-size: 12px; opacity: 0.6;">(Click anywhere to start Landscape Mode)</span>
    </div>

    <div class="edge-glow"></div>

    <div class="main-content">
        <div class="brand">NI MY SWEET</div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
        <div class="next-btn">NEXT</div>
    </div>

    <script>
        async function launchGameMode() {
            // ১. ফুল স্ক্রিন রিকোয়েস্ট (ব্রাউজার বার হাইড করতে)
            let el = document.documentElement;
            if (el.requestFullscreen) {
                await el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                await el.webkitRequestFullscreen();
            }

            // ২. ল্যান্ডস্কেপ মোড লক করা (গেমের মতো)
            if (screen.orientation && screen.orientation.lock) {
                try {
                    await screen.orientation.lock('landscape');
                } catch (error) {
                    console.log("Orientation lock failed: ", error);
                }
            }
        }

        // ৩ সেকেন্ড পর এনিমেশন ও ভাইব্রেশন
        setTimeout(() => {
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }, 3000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDV - Digital Villa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ম্যাপ এবং বাটন লেআউট */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        #map { height: 100%; width: 100%; }

        /* বাটন বা ক্যাটাগরি প্যানেল (ম্যাপের ওপর ভাসমান) */
        .controls {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 1000;
        }
        .btn {
            background: rgba(0, 0, 0, 0.85); border: 1px solid #00ff41;
            color: #00ff41; padding: 15px; border-radius: 10px;
            text-align: center; font-size: 12px; font-weight: bold;
        }

        /* লোগো এবং স্ট্যাটাস বার (উপরে) */
        .top-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; z-index: 1000;
        }
        .logo { color: #00ff41; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">TDV</div>
        <div style="background: rgba(0,0,0,0.7); padding: 5px 10px; color: #fff; border-radius: 5px; font-size: 12px;">ব্যালেন্স: ৳০</div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <div class="btn" onclick="alert('কুরিয়ার সেবা সক্রিয়')">কুরিয়ার</div>
        <div class="btn" onclick="alert('দোকান সংযোগ')">দোকান</div>
        <div class="btn" onclick="alert('কৃষি ম্যাপ')">কৃষি</div>
        <div class="btn" onclick="alert('সেবা বাটন')">সেবা</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([23.685, 90.356], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    </script>
</body>
</html>

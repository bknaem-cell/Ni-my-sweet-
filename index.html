<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ni-my-sweet- Advanced Software</title>
    <script src="//unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #0b0e14; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
        
        /* প্রিমিয়াম হেডার */
        #header { padding: 30px 20px; text-align: center; background: linear-gradient(180deg, #161b22 0%, #0b0e14 100%); border-bottom: 1px solid #30363d; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #header h1 { font-size: 28px; margin: 0; color: #58a6ff; letter-spacing: 1px; }
        #header p { margin: 5px 0 0; color: #8b949e; font-size: 14px; }

        /* কামালের স্মার্ট বক্স */
        .kamal-container { padding: 20px; }
        .kamal-box { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; padding: 20px; border-radius: 15px; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .kamal-box h2 { color: #3fb950; margin: 0 0 10px; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .kamal-box p { font-size: 15px; line-height: 1.6; color: #c9d1d9; }

        /* থ্রিডি গ্লোব সেকশন */
        #globeViz { width: 100%; height: 450px; margin-top: -30px; }

        /* ভয়েস ও কন্ট্রোল প্যানেল */
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: -50px; position: relative; z-index: 10; padding: 20px; }
        .voice-btn { background: #238636; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(35, 134, 54, 0.4); }
        .voice-btn:hover { background: #2ea043; transform: scale(1.05); }

        /* বটম নেভিগেশন */
        .nav-menu { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #161b22; padding: 15px 0; border-top: 1px solid #30363d; z-index: 100; }
        .nav-item { color: #8b949e; text-decoration: none; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s; }
        .nav-item.active { color: #58a6ff; font-weight: bold; }
        .nav-item:hover { color: white; }
    </style>
</head>
<body>

<div id="header">
    <h1>নাঈম ইব্রাহিম</h1>
    <p>অ্যাডমিন | আইডি: BD-0001</p>
</div>

<div class="kamal-container">
    <div class="kamal-box">
        <h2><span>🤖</span> কামাল (গাইড)</h2>
        <p id="kamal-msg">আসসালামুয়ালাইকুম নাঈম! আপনার ১০ কিলো স্কয়ার প্রজেক্টের ম্যাপ প্রস্তুত। আপনি ভয়েস কমান্ড দিয়ে ঘর বা দোকান সেট করতে পারেন।</p>
    </div>
</div>

<div id="globeViz"></div>

<div class="controls">
    <button class="voice-btn" onclick="startVoice()">🎙️ ভয়েস কমান্ড দিন</button>
</div>

<div class="nav-menu">
    <a href="#" class="nav-item"><span>🏗️</span> বিল্ডার</a>
    <a href="#" class="nav-item"><span>🛒</span> দোকান</a>
    <a href="#" class="nav-item"><span>🚚</span> কুরিয়ার</a>
    <a href="#" class="nav-item active"><span>👤</span> প্রোফাইল</a>
</div>

<script>
    // থ্রিডি গ্লোব সেটআপ
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true)
      .atmosphereColor('#58a6ff')
      .atmosphereAltitude(0.12);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // ভয়েস কমান্ড সিস্টেম (প্রাথমিক)
    function startVoice() {
        const msgBox = document.getElementById('kamal-msg');
        msgBox.innerText = "আমি শুনছি... বলুন আপনি কী করতে চান?";
        
        // এখানে পরবর্তীতে Web Speech API যুক্ত করা হবে
        setTimeout(() => {
            msgBox.innerText = "আপনি বললেন 'দোকান দিতে চাই'। আমি দোকানের ডিজাইনগুলো লোড করছি...";
        }, 3000);
    }
</script>

</body>
</html>

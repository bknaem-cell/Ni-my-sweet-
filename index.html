<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ni My Sweet</title>
    <style>
        /* আপনার আগের ইন্টারফেস ফিরিয়ে আনা */
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            /* ব্যাক বাটন ও স্ক্রল সচল রাখা */
            overflow: auto; 
        }

        /* ১. চুলের মতো চিকন জীবন্ত বর্ডার */
        #living-border {
            position: fixed;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            pointer-events: none; /* যাতে ক্লিক আটকে না যায় */
            z-index: 9999;
            animation: breathe 5s infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }

        /* ২. ক্লিকে সাদা ছোট ফোটা (সোনালী নয়) */
        .click-dot {
            position: fixed;
            width: 6px; /* ছোট ফোটা */
            height: 6px;
            background: white; /* সাদা রঙ */
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: scale(0);
            animation: ripple 0.4s ease-out;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        /* ৩. কাজ করলে বর্ডারের ধাপ (কালার চেঞ্জ) */
        .border-flash {
            border-color: white !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h1 style="letter-spacing: 5px;">NI MY SWEET</h1>
        <p id="status" style="font-size: 14px; opacity: 0.7;">System Active</p>
    </div>

    <div id="living-border"></div>

    <script>
        document.addEventListener('click', function(e) {
            // সাদা ছোট ফোটা তৈরি
            let dot = document.createElement('div');
            dot.className = 'click-dot';
            dot.style.left = (e.clientX - 3) + 'px';
            dot.style.top = (e.clientY - 3) + 'px';
            document.body.appendChild(dot);

            // বর্ডারে সাদা ধাপ মারা
            const border = document.getElementById('living-border');
            border.classList.add('border-flash');

            // টেক্সট পরিবর্তন (প্রথম অক্ষর বড় হাতের)
            const status = document.getElementById('status');
            const messages = ["System Active", "Connecting...", "Syncing...", "Finishing..."];
            let current = messages.indexOf(status.innerText);
            status.innerText = messages[(current + 1) % messages.length];

            setTimeout(() => {
                dot.remove();
                border.classList.remove('border-flash');
            }, 400);
        });
    </script>
</body>
</html>

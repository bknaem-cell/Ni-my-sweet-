<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDV Advanced System</title>
    <style>
        /* আপনার স্কেচ অনুযায়ী ডার্ক গোল্ডেন থিম */
        body { 
            margin: 0; 
            padding: 0; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); 
            color: #fff; 
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* আপনার স্কেচের সেই PIN বক্স */
        .main-container {
            border: 2px solid #c9a050;
            padding: 40px;
            border-radius: 30px;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 30px rgba(201, 160, 80, 0.5);
            text-align: center;
            min-width: 300px;
        }

        .tdv-logo {
            font-size: 50px;
            color: #ff4500;
            font-weight: bold;
            text-shadow: 0 0 15px #ff4500;
            margin-bottom: 20px;
        }

        .pin-display {
            font-size: 35px;
            color: #c9a050;
            border: 1px solid #c9a050;
            padding: 10px 20px;
            margin: 20px 0;
            letter-spacing: 5px;
        }

        .ok-btn {
            background: #c9a050;
            color: #000;
            border: none;
            padding: 10px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        /* উপরের স্ট্যাটাস বার */
        .status-bar {
            position: absolute;
            top: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <div style="color: #c9a050;">🪙 NJ Gold: 10,0000</div>
        <div style="color: #58a6ff;">👤 নাঈম ইব্রাহিম (Admin)</div>
    </div>

    <div class="main-container">
        <div class="tdv-logo">TDV</div>
        <p style="color: #8b949e; font-size: 12px;">নিরাপত্তা প্যানেল</p>
        <div class="pin-display">PIN 30</div>
        <button class="ok-btn">OK</button>
    </div>

    <p style="position: absolute; bottom: 30px; color: #3fb950;">সিস্টেম অনলাইন - ১০ কিলো স্কয়ার সক্রিয়</p>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ni My Sweet</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* চিকন জীবন্ত বর্ডার */
        #living-border {
            position: fixed;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            pointer-events: none;
            z-index: 9999;
            animation: breathe 5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.1); }
        }

        /* ছোট সাদা ফোটা (ক্লিক ফিডব্যাক) */
        .white-dot {
            position: fixed;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            animation: ripple 0.4s ease-out;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        /* লোডিং বার স্টাইল */
        .status-container {
            width: 200px;
            text-align: center;
        }

        .progress-bg {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.5s linear;
        }

        #status {
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        h1 { letter-spacing: 5px; font-size: 2rem; margin-bottom: 20px; }
    </style>
</head>
<body onclick="enableAutoSystem()">

    <div class="main-content">
        <h1>NI MY SWEET</h1>
        <div class="status-container">
            <div class="progress-bg">
                <div id="progress-bar"></div>
            </div>
            <p id="status">System Active</p>
        </div>
    </div>

    <div id="living-border"></div>

    <script>
        const progressBar = document.getElementById('progress-bar');
        const statusLabel = document.getElementById('status');
        const messages = ["System Active", "Connecting...", "Syncing...", "Finishing...", "Ready"];
        
        // অটোমেটিক লোডিং ফাংশন
        function startAutoLoading() {
            let step = 0;
            let interval = setInterval(() => {
                if (step < messages.length) {
                    statusLabel.innerText = messages[step];
                    progressBar.style.width = ((step + 1) * 20) + "%";
                    step++;
                } else {
                    // লোডিং শেষ হলে আবার শুরু হবে অথবা স্থির থাকবে
                    setTimeout(() => {
                        step = 0;
                        progressBar.style.width = "0%";
                    }, 2000);
                }
            }, 2500); // প্রতি ২.৫ সেকেন্ড পর পর পরিবর্তন হবে
        }

        // প্রথম ক্লিকে ফুল স্ক্রিন এবং অটো লোডিং শুরু
        function enableAutoSystem() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(e => console.log(e));
                }
            }
        }

        // পেজ লোড হওয়ার সাথে সাথেই অটো লোডিং শুরু হবে
        window.onload = startAutoLoading;

        // সাদা ফোটা ইফেক্ট (শুধুমাত্র ক্লিক করলে দেখাবে)
        document.addEventListener('click', function(e) {
            let dot = document.createElement('div');
            dot.className = 'white-dot';
            dot.style.left = (e.clientX - 2.5) + 'px';
            dot.style.top = (e.clientY - 2.5) + 'px';
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 400);
        });
    </script>
</body>
</html>

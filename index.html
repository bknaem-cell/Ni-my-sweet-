<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naeem's System</title>
    <style>
        /* পুরো স্ক্রিনের ব্যাকগ্রাউন্ড এবং ল্যান্ডস্কেপ ঠিক রাখা */
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* আপনার পছন্দের সেই ডিজিটাল গ্রিড ব্যাকগ্রাউন্ড */
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            text-align: center;
        }

        .text {
            color: white;
            font-size: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-bottom: 20px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        /* আপনার সেই সাদা বর্ডারযুক্ত লোডিং বক্স */
        .loading-box {
            width: 300px;
            height: 10px;
            border: 1px solid white;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            background-color: white;
            width: 0%;
            animation: load 4s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        @keyframes load {
            to { width: 100%; }
        }

        /* ক্লিক করার স্থানে নিওন আলোর আভা */
        .click-glow {
            position: absolute;
            width: 15px;
            height: 15px;
            background: rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: glow-out 0.6s ease-out forwards;
            box-shadow: 0 0 20px 8px rgba(0, 255, 255, 0.6);
            z-index: 9999;
        }

        @keyframes glow-out {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text">NAEEM SWEET SYSTEM</div>
        <div class="loading-box">
            <div class="loading-bar"></div>
        </div>
    </div>

    <script>
        // ক্লিক করলে আলোর আভা তৈরি করার সিস্টেম
        document.addEventListener('mousedown', function(e) {
            let glow = document.createElement('div');
            glow.className = 'click-glow';
            glow.style.left = e.pageX + 'px';
            glow.style.top = e.pageY + 'px';
            document.body.appendChild(glow);
            setTimeout(() => { glow.remove(); }, 600);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ni My Sweet - Loading</title>
    <style>
        /* বেসিক সেটআপ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body {
            background-color: #000; /* একদম গভীর কালো ব্যাকগ্রাউন্ড */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* চুলের মতো চিকন বর্ডার লাইটিং (Hairline Border) */
        .border-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1.5px solid transparent;
            pointer-events: none;
            z-index: 1000;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { border-color: rgba(0, 100, 255, 0.5); box-shadow: inset 0 0 5px rgba(0, 100, 255, 0.2); }
            50% { border-color: rgba(255, 0, 0, 0.8); box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.4); }
            100% { border-color: rgba(0, 100, 255, 0.5); box-shadow: inset 0 0 5px rgba(0, 100, 255, 0.2); }
        }

        /* কন্টেন্ট কন্টেইনার - যা সবসময় মাঝখানে থাকবে */
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            transition: all 0.3s ease; /* ০.৩০ সেকেন্ড স্পিড লজিক */
        }

        /* আপনার প্রোফাইল কার্ড আইকন */
        .profile-card {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid white; /* উজ্জ্বল সাদা বর্ডার */
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            animation: card-pulse 1.5s infinite;
        }

        @keyframes card-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        h1 {
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* লোডিং বার */
        .loading-box {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            margin-bottom: 15px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px white;
            transition: width 0.05s linear;
        }

        /* স্ট্যাটাস টেক্সট */
        .status-container {
            font-size: 16px;
            font-weight: 300;
        }

        /* ল্যান্ডস্কেপ মোড ফিক্স */
        @media screen and (orientation: landscape) {
            .container {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                max-width: 80%;
            }
            .profile-card { margin: 0 30px 0 0; }
            h1 { margin-bottom: 0; margin-right: 30px; }
            .loading-box { width: 200px; margin-bottom: 0; margin-right: 20px; }
        }
    </style>
</head>
<body onclick="startLoading()">

    <div class="border-glow"></div>

    <div class="container">
        <div class="profile-card">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
        </div>

        <h1>NI MY SWEET</h1>

        <div class="loading-box">
            <div class="progress" id="progress"></div>
        </div>

        <div class="status-container">
            <span id="percent">০%</span> <br>
            <small id="status">চালু হচ্ছে...</small>
        </div>
    </div>

    <script>
        // ফুল স্ক্রিন ফাংশন
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            }
        }

        // লোডিং শুরু করার ফাংশন (০.৩০ স্পিড লজিক সহ)
        function startLoading() {
            toggleFullScreen();
            let progress = document.getElementById('progress');
            let percentText = document.getElementById('percent');
            let width = 0;
            
            // ডিভাইসের নেটওয়ার্ক ও ফোন অনুযায়ী স্পিড নির্ধারণ
            let speed = 20; // ডিফল্ট হাই স্পিড

            let interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    document.getElementById('status').innerText = "সম্পন্ন";
                    // এখানে পরবর্তী পেইজের লিঙ্ক দিতে পারেন
                } else {
                    width++;
                    progress.style.width = width + '%';
                    percentText.innerText = width + '%';
                    
                    // বর্ডারের রঙ পরিবর্তনের পালস
                    if(width % 10 == 0) {
                        document.querySelector('.border-glow').style.boxShadow = "inset 0 0 30px rgba(255, 0, 0, 0.6)";
                        setTimeout(() => {
                            document.querySelector('.border-glow').style.boxShadow = "none";
                        }, 100);
                    }
                }
            }, speed);
        }
    </script>
</body>
</html>

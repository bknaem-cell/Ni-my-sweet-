<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, orientation=landscape">
    <title>Naeem Sweet System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            text-align: center;
        }

        .text {
            color: white;
            font-size: 35px;
            font-family: Arial, sans-serif;
            margin-bottom: 30px;
            letter-spacing: 10px;
            font-weight: bold;
        }

        /* আপনার পছন্দের সেই লোডিং বক্সের ডিজাইন */
        .loading-box {
            width: 400px;
            height: 30px; /* উচ্চতা কিছুটা বাড়ানো হয়েছে যেন পার্সেন্ট দেখা যায় */
            border: 2px solid white;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background-color: white;
            width: 0%;
            position: absolute;
            left: 0;
            top: 0;
            animation: load 5s linear forwards;
        }

        /* বক্সের ভেতরের পার্সেন্টেজ টেক্সট */
        .percent-text {
            color: white;
            font-size: 14px;
            font-family: Arial, sans-serif;
            z-index: 2;
            mix-blend-mode: difference; /* এটি বার বাড়ার সাথে সাথে টেক্সটের রঙ অটো পরিবর্তন করবে */
            font-weight: bold;
        }

        @keyframes load {
            to { width: 100%; }
        }

        /* ক্লিক গ্লো ইফেক্ট */
        .click-glow {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: glow-out 0.6s ease-out forwards;
            box-shadow: 0 0 15px 5px rgba(0, 255, 255, 0.5);
            z-index: 9999;
        }

        @keyframes glow-out {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text">NAEEM SWEET SYSTEM</div>
        <div class="loading-box">
            <div class="loading-bar"></div>
            <div class="percent-text" id="percent">0%</div>
        </div>
    </div>

    <script>
        // পার্সেন্টেজ আপডেট করার ফাংশন
        let percentElement = document.getElementById('percent');
        let count = 0;
        let interval = setInterval(() => {
            count++;
            percentElement.innerText = count + '%';
            if (count >= 100) {
                clearInterval(interval);
            }
        }, 50); // লোডিং বারের গতির সাথে মিলিয়ে বাড়ানো কমানো যাবে

        // ক্লিক ইফেক্ট
        document.addEventListener('click', function(e) {
            let glow = document.createElement('div');
            glow.className = 'click-glow';
            glow.style.left = e.pageX + 'px';
            glow.style.top = e.pageY + 'px';
            document.body.appendChild(glow);
            setTimeout(() => { glow.remove(); }, 600);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ni-my-sweet- Advanced System</title>
    <style>
        /* AMOLED এর জন্য খাঁটি কালো এবং ফুল স্ক্রিন */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif; /* ডিজিটাল ফন্ট */
            cursor: pointer;
        }

        /* গ্রিড ব্যাকগ্রাউন্ড যা আপনি পছন্দ করেছেন */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .main-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* গেমের মতো লোগো এনিমেশন */
        .logo {
            color: #ffffff;
            font-size: 50px;
            font-weight: bold;
            letter-spacing: 15px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffff; opacity: 0.8; }
            to { text-shadow: 0 0 30px #00ffff, 0 0 50px #00ffff; opacity: 1; }
        }

        /* ১০০ জন উন্নত মানুষের মতো প্রফেশনাল লোডিং বার */
        .progress-box {
            width: 400px;
            height: 6px;
            background: #111;
            border: 1px solid #333;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ffffff);
            box-shadow: 0 0 20px #00ffff;
            animation: fillUp 6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillUp {
            to { width: 100%; }
        }

        .loading-text {
            margin-top: 20px;
            color: #00ffff;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* টাচ করলে ১০০ গুণ বেশি ব্রাইট স্পার্ক */
        .touch-spark {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 30px #00ffff;
            animation: explode 0.7s ease-out forwards;
        }

        @keyframes explode {
            to { transform: scale(8); opacity: 0; }
        }
    </style>
</head>
<body onclick="startSystem()">

    <div class="background-grid"></div>

    <div class="main-content">
        <div class="logo">Ni-my-sweet-</div>
        <div class="progress-box">
            <div class="progress-fill"></div>
        </div>
        <div class="loading-text">সিস্টেম ইনিশিয়ালাইজ হচ্ছে... <span id="pct">0</span>%</div>
    </div>

    <script>
        // ইউজার ক্লিক করলে ফুল স্ক্রিন এবং ল্যান্ডস্কেপ হবে
        function startSystem() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape');
            }
        }

        // পার্সেন্টেজ আপডেট
        let pct = document.getElementById('pct');
        let count = 0;
        let timer = setInterval(() => {
            count++;
            pct.innerText = count;
            if(count >= 100) clearInterval(timer);
        }, 60);

        // অ্যাডভান্সড টাচ ইফেক্ট
        document.addEventListener('mousedown', (e) => {
            let spark = document.createElement('div');
            spark.className = 'touch-spark';
            spark.style.left = e.pageX + 'px';
            spark.style.top = e.pageY + 'px';
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 700);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাঈম ১৮ - মিশন কন্ট্রোল</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000; color: #fff; text-align: center; margin: 0; }
        .header { background: #fff; color: #000; padding: 15px; }
        #map-box { 
            width: 100%; height: 400px; 
            background: #111; border-top: 3px solid #28a745; 
            display: flex; align-items: center; justify-content: center;
        }
        .marker { color: #28a745; font-size: 20px; border: 2px dashed #28a745; padding: 20px; border-radius: 50%; }
        .control-btn { background: #28a745; color: #fff; padding: 20px; border: none; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h2>নাঈম ইব্রাহিম প্রজেক্ট</h2>
        <p>১০ কিলো স্কয়ার মিশন কন্ট্রোল</p>
    </div>

    <div id="map-box">
        <div class="marker">🌍 ম্যাপ লোড হচ্ছে...<br>আপনার অবস্থান চিহ্নিত করুন</div>
    </div>

    <button class="control-btn" onclick="alert('লোকেশন ডাটাবেজে রেকর্ড হচ্ছে...')">আমার বাড়ির লোকেশন সেট করুন</button>
</body>
</html>

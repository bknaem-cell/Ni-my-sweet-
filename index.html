<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, orientation=landscape">
    <title>TdV - The Digital Villa</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072') no-repeat center center fixed;
            background-size: cover; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white;
        }

        /* গ্লাস মরফিজম ও ভাসমান ইফেক্ট */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); /* নিওন আলোর দাগ */
            border-radius: 15px;
            position: absolute;
        }

        /* মেইন কন্টেইনার */
        .dashboard {
            width: 100vw; height: 100vh; position: relative;
        }

        /* আপনার স্কেচের বাটন পজিশন অনুযায়ী (সিরিয়াল ১১, ১২, ১৩, ১৪) */
        .btn-left-top { top: 5%; left: 2%; width: 120px; height: 60px; } /* বাটন ১১ */
        .btn-left-mid { top: 20%; left: 2%; width: 120px; height: 60px; } /* বাটন ১৩ */
        .btn-left-bottom { bottom: 5%; left: 2%; width: 120px; height: 60px; } /* বাটন ১২/১৪ */
        
        /* ম্যাপ এরিয়া (ক্যামেরার পাশে গোল ম্যাপ) */
        .mini-map {
            top: 2%; left: 40%; width: 90px; height: 90px;
            border-radius: 50%; border: 2px solid #00f7ff;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px #00f7ff;
        }

        /* প্রোফাইল ও ব্যালেন্স (ডান পাশে) */
        .profile-area { top: 5%; right: 2%; width: 180px; height: 120px; padding: 10px; }
        .balance-area { top: 30%; right: 2%; width: 150px; height: 60px; display: flex; align-items: center; justify-content: center; }

        /* ভয়েস কমান্ড এরিয়া (নিচে আপনার লাল দাগ দেওয়া অংশ) */
        .voice-section {
            bottom: 5%; left: 30%; width: 40%; height: 70px;
            display: flex; align-items: center; padding: 0 20px;
            border: 2px solid #ff0055; /* আপনার লাল দাগের সম্মানার্থে */
        }

        .mic-icon { font-size: 30px; margin-right: 15px; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-text { font-size: 14px; font-weight: bold; text-align: center; line-height: 60px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div id="logo-layer" style="position:fixed; width:100%; height:100%; background:black; z-index:99; display:flex; flex-direction:column; justify-content:center; align-items:center;">
             <div style="width:150px; height:150px; background:cyan; clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display:flex; justify-content:center; align-items:center;">
                <h2 style="color:black;">TdV</h2>
             </div>
             <p>The Digital Villa - নাঈম ইব্রাহিম</p>
             <button onclick="document.getElementById('logo-layer').style.display='none'" style="margin-top:20px; padding:10px 30px; cursor:pointer;">প্রবেশ করুন (OK)</button>
        </div>

        <div class="glass-panel btn-left-top btn-text">১১: আমার এলাকা</div>
        <div class="glass-panel btn-left-mid btn-text">১৩: কুরিয়ার</div>
        <div class="glass-panel btn-left-bottom btn-text">১২: বাজার</div>

        <div class="glass-panel mini-map">🌍</div>

        <div class="glass-panel profile-area">
            <strong>নাঈম বাদশা</strong><br>
            <small>ID: TdV-18</small><br>
            <small>১৯-০২-২০২৬</small>
        </div>
        <div class="glass-panel balance-area">০০ টাকা</div>

        <div class="glass-panel voice-section">
            <span class="mic-icon">🎙️</span>
            <div id="status">শুনছি নাঈম ইব্রাহিম... (ভয়েস কমান্ড দিন)</div>
        </div>
    </div>

</body>
</html>

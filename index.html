<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাঈম ১৮ - ক্লিন কন্ট্রোল ম্যাপ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* ম্যাপের এরিয়া - কোনো লিঙ্ক ছাড়া */
        #map { height: 100vh; width: 100vw; background: #0b1a0e; }
        
        /* উপরের স্ট্যাটাস বার */
        .top-bar { 
            position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.8); 
            color: #28a745; padding: 10px; z-index: 1000; text-align: center;
            border-bottom: 2px solid #28a745; font-weight: bold;
        }

        /* নিচের কন্ট্রোল বাটন */
        .bottom-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: #28a745; color: white; padding: 15px 30px;
            border: none; border-radius: 50px; cursor: pointer; font-size: 16px;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.5);
        }

        /* গুগল ম্যাপের লিঙ্ক লুকানোর ট্রিক */
        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { border: none !important; margin-top: 60px !important; }
    </style>
</head>
<body onload="initCleanMap()">

    <div class="top-bar">
        নাঈম ইব্রাহিম মিশন: জন্মভিটা ও সম্পত্তি রেকর্ড (১০ কিলো স্কয়ার)
    </div>

    <div id="map"></div>

    <button class="bottom-btn" onclick="saveProperty()">🏡 আমার বাড়ির সীমানা নিশ্চিত করুন</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let drawnItems;

        function initCleanMap() {
            // ক্লিন ডার্ক রোড ম্যাপ লোড করা হচ্ছে (লিঙ্ক ছাড়া)
            map = L.map('map', {
                zoomControl: true,
                attributionControl: false // এটি ম্যাপের নিচের সব লিঙ্ক মুছে দেবে
            }).setView([23.8103, 90.4125], 13);

            // শুধু রাস্তা এবং এলাকার ম্যাপ (ক্লিন লুক)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(map);

            // ম্যাপে ক্লিক করলে পিন বসবে
            map.on('click', function(e) {
                L.marker(e.latlng).addTo(map)
                    .bindPopup("আপনার সম্পত্তি চিহ্নিত হয়েছে।").openPopup();
            });
        }

        function saveProperty() {
            let info = prompt("আপনার নাম এবং জমির পরিমাণ (শতাংশ) লিখুন:");
            if(info) {
                alert("ধন্যবাদ নাঈম ভাই, এই সম্পত্তির ম্যাপ ডেটা আপনার প্রোফাইলে সেভ করা হয়েছে।");
            }
        }
    </script>
</body>
</html>

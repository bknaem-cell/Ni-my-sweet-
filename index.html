<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NI MY SWEET - Ultra Slim Edge</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial', sans-serif;
            cursor: pointer;
        }

        /* চুলের মতো অতি সূক্ষ্ম গ্লো বর্ডার */
        .edge-glow {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 9999;
            box-sizing: border-box;
            /* বর্ডারটি ০.৫ পিক্সেল করা হয়েছে যা একদম চিকন দেখাবে */
            border: 0.5px solid rgba(0, 255, 255, 0.4); 
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.2);
        }

        /* আপনার সেই সাদা প্রিমিয়াম ব্র্যান্ডিং */
        .main-content { text-align: center; width: 340px; }
        .brand {
            color: #ffffff; font-size: 32px; font-weight: 800; margin-bottom: 25px;
            letter-spacing: 4px; text-transform: uppercase;
        }

        .bar-bg { height: 12px; width: 100%; background: #111; border-radius: 20px; overflow: hidden; border: 0.5px solid #222; }
        .bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff0000, #ffbb00, #44ff00, #00ffff, #0044ff);
            background-size: 300% 100%; animation: load 3s forwards linear;
        }

        @keyframes load { to { width: 100%; } }
        .next-btn { color: #fff; margin-top: 15px; font-size: 11px; letter-spacing: 8px; opacity: 0.5; }
    </style>
</head>
<body onclick="launchGameMode()">

    <div class="edge-glow"></div>

    <div class="main-content">
        <div class="brand">NI MY SWEET</div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
        <div class="next-btn">NEXT</div>
    </div>

    <script>
        async function launchGameMode() {
            let el = document.documentElement;
            if (el.requestFullscreen) { await el.requestFullscreen(); }
            
            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } catch (e) {}
            }
        }

        setTimeout(() => {
            if(navigator.vibrate) navigator.vibrate([80, 40, 80]);
        }, 3000);
    </script>
</body>
</html>

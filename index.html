<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ni My Sweet</title>
    <style>
        /* ১. ফুল স্ক্রিন ও ল্যান্ডস্কেপ মোড সেটিংস */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* ফুল ডিসপ্লে লুকের জন্য */
            cursor: pointer;
        }

        /* ২. চিকন জীবন্ত বর্ডার */
        #living-border {
            position: fixed;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            pointer-events: none;
            z-index: 9999;
        }

        /* ৩. ছোট সাদা ফোটা (Ripple) */
        .white-dot {
            position: fixed;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            animation: ripple 0.4s ease-out;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        h1 { letter-spacing: 5px; font-size: 2rem; }
    </style>
</head>
<body onclick="toggleFullScreen()">

    <div style="text-align: center;">
        <h1>NI MY SWEET</h1>
        <p id="status">System Active</p>
    </div>

    <div id="living-border"></div>

    <script>
        // ১. এক ক্লিকে ফুল স্ক্রিন ও ল্যান্ডস্কেপ করার ফাংশন
        async function toggleFullScreen() {
            if (!document.fullscreenElement) {
                try {
                    await document.documentElement.requestFullscreen();
                    // ল্যান্ডস্কেপ মোড লক করা (যদি ব্রাউজার সাপোর্ট করে)
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                    }
                } catch (err) {
                    console.log("ফুল স্ক্রিন মুডে সমস্যা হয়েছে");
                }
            }
        }

        // ২. ক্লিক ফিডব্যাক (সাদা ফোটা)
        document.addEventListener('click', function(e) {
            let dot = document.createElement('div');
            dot.className = 'white-dot';
            dot.style.left = (e.clientX - 2.5) + 'px';
            dot.style.top = (e.clientY - 2.5) + 'px';
            document.body.appendChild(dot);

            // টেক্সট পরিবর্তন
            const status = document.getElementById('status');
            const msgs = ["System Active", "Connecting...", "Syncing...", "Finishing..."];
            let idx = msgs.indexOf(status.innerText);
            status.innerText = msgs[(idx + 1) % msgs.length];

            setTimeout(() => dot.remove(), 400);
        });
    </script>
</body>
</html>

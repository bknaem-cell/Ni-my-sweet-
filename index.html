<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ni My Sweet - Elite</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none;
        }

        /* আপনার পছন্দমতো আইকনটি একদম উপরে মাঝ বরাবর */
        #top-fixed-logo {
            position: fixed; 
            top: 25px; left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 50px; 
            background: rgba(255,255,255,0.05);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 1000; font-size: 24px;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(255,255,255,0.2); opacity: 0.6; }
            50% { box-shadow: 0 0 20px rgba(0,255,255,0.3); opacity: 1; }
            100% { box-shadow: 0 0 5px rgba(255,255,255,0.2); opacity: 0.6; }
        }

        /* মেইন কন্টেইনার */
        .master-box {
            text-align: center;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .brand-name {
            font-size: clamp(32px, 10vw, 55px);
            font-weight: 700; margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(255,255,255,0.4);
            letter-spacing: 2px;
        }

        .loader-box {
            width: 100%; max-width: 300px; height: 3px;
            background: #111; position: relative; border-radius: 10px;
        }

        .loader-fill {
            position: absolute; height: 100%; width: 0%;
            background: #fff; box-shadow: 0 0 15px #fff;
            transition: width 0.05s linear;
        }

        .status-text {
            margin-top: 20px; color: #00ffff; font-size: 11px;
            letter-spacing: 3px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body onclick="launchSystem()">

    <div id="top-fixed-logo">🔄</div>

    <div class="master-box">
        <div class="brand-name">Ni My Sweet</div>
        <div class="loader-box">
            <div class="loader-fill" id="bar"></div>
        </div>
        <div id="status" class="status-text">TAP TO START SYSTEM</div>
    </div>

    <script>
        let isStarted = false;

        function launchSystem() {
            if (isStarted) return;
            isStarted = true;

            // ফুল স্ক্রিন রিকোয়েস্ট
            let doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // লোডিং শুরু
            let w = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            
            const timer = setInterval(() => {
                w++;
                bar.style.width = w + '%';
                
                if(w == 30) status.innerText = "ALIGING HARDWARE...";
                if(w == 70) status.innerText = "OPTIMIZING DISPLAY...";
                
                if (w >= 100) {
                    clearInterval(timer);
                    status.innerText = "SYSTEM ACTIVE";
                }
            }, 30);
        }

        // ফোন ঘোরালে আইকনটি উজ্জ্বল হবে
        window.addEventListener("orientationchange", function() {
            const status = document.getElementById('status');
            if(!isStarted) status.innerText = "ORIENTATION CHANGED - TAP TO START";
        });
    </script>
</body>
</html>

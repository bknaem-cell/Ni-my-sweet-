<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম লোডিং - নাঈম ইব্রাহিম</title>
    <style>
        /* পুরো স্ক্রিন ডার্ক এবং মাঝখানে লোডার */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d1117; /* GitHub ডার্ক থিম */
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* প্রিমিয়াম রিঙ অ্যানিমেশন */
        .loader {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .loader div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 80px;
            height: 80px;
            margin: 8px;
            border: 8px solid #58a6ff;
            border-radius: 50%;
            animation: loader-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #58a6ff transparent transparent transparent;
        }

        .loader div:nth-child(1) { animation-delay: -0.45s; }
        .loader div:nth-child(2) { animation-delay: -0.3s; }
        .loader div:nth-child(3) { animation-delay: -0.15s; }

        @keyframes loader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* লোডিং টেক্সট */
        .loading-text {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #c9d1d9;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="loader">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div class="loading-text">Loading...</div>
    </div>

</body>
</html>

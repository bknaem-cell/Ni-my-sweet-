<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDV Advanced Space System</title>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #00ff41; }
        
        /* মহাকাশে ভাসমান ইন্টারফেস লেয়ার */
        #ui-layer {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,25,0,0.5) 100%);
        }

        .neon-box {
            background: rgba(0, 30, 0, 0.8); border: 1px solid #00ff41;
            border-radius: 12px; padding: 15px; backdrop-filter: blur(8px);
            box-shadow: 0 0 20px #00ff41; pointer-events: auto;
        }

        /* আপনার স্কেচ ৪৩১৪ ও ৪৩১২ অনুযায়ী PIN সেন্টার */
        .center-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: auto;
        }

        .scanner {
            width: 170px; height: 170px; border: 2px dashed #00ff41; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 30px #00ff41;
            animation: rotateScanner 12s linear infinite;
        }
        @keyframes rotateScanner { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .pin-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 11; }

        .btn-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .neon-btn {
            background: transparent; border: 1px solid #00ff41; color: #00ff41;
            padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: bold;
            text-transform: uppercase; pointer-events: auto; transition: 0.3s;
        }
        .neon-btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }

        #globeViz { position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div id="ui-layer">
    <div class="neon-box" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="margin:0;">নাঈম ইব্রাহিম | TDV ADVANCED</h2>
            <small>SECURITY STATUS: ENCRYPTED</small>
        </div>
        <div style="color: #ccff00; font-size: 1.3em; font-weight: bold;">🪙 10,0000 NJ Gold</div>
    </div>

    <div class="center-hub">
        <h1 style="color:#00ff41; margin-bottom: 25px; text-shadow: 0 0 20px #00ff41;">TDV SYSTEM</h1>
        <div class="scanner"></div>
        <div class="pin-display">
            <div style="font-size: 28px; font-weight: bold;">PIN 30</div>
            <button class="neon-btn" style="font-size: 10px; margin-top: 10px; padding: 4px 10px;">ENTER</button>
        </div>
    </div>

    <div class="btn-group">
        <button class="neon-btn">🏗️ বিল্ডার</button>
        <button class="neon-btn">🛒 Lovee Market</button>
        <button class="neon-btn">🚀 কুরিয়ার</button>
    </div>
</div>

<script>
    // পৃথিবী এবং মহাকাশের দৃশ্য লোড করার উন্নত পদ্ধতি
    const world = Globe()(document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-stars.png')
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true)
      .atmosphereColor('#00ff41')
      .atmosphereAltitude(0.2);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    world.pointOfView({ lat: 23.5, lng: 90.3, alt: 2.5 });
</script>

</body>
</html>

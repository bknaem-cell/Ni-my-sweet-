<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ni-my-sweet-</title>
    <style>
        /* AMOLED এর জন্য খাঁটি কালো ব্যাকগ্রাউন্ড */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ল্যান্ডস্কেপ মুড ফোর্স করা */
        @media screen and (orientation: portrait) {
            .container { transform: rotate(0deg); }
        }

        .container {
            text-align: center;
            width: 100%;
        }

        .text {
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 12px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* লোডিং বক্সের আধুনিক ডিজাইন */
        .loading-box {
            width: 60%;
            max-width: 500px;
            height: 12px;
            border: 1px solid #444;
            margin: 0 auto;
            position: relative;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background-color: #ffffff;
            width: 0%;
            animation: load 5s cubic-bezier(0.1, 0, 0.1, 1) forwards;
        }

        .percent-text {
            color: #888;
            font-size: 1rem;
            margin-top: 15px;
            letter-spacing: 3px;
        }

        @keyframes load {
            to { width: 100%; }
        }

        /* আপনার পছন্দের সেই ক্লিক ইফেক্ট */
        .click-glow {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 20px 10px rgba(0, 255, 255, 0.5);
            animation: explode 0.5s ease-out forwards;
        }

        @keyframes explode {
            to { transform: scale(6); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text">Ni-my-sweet-</div>
        <div class="loading-box">
            <div class="loading-bar"></div>
        </div>
        <div class="percent-text" id="status">INITIALIZING SYSTEM... <span id="percent">0</span>%</div>
    </div>

    <script>
        // পার্সেন্টেজ কাউন্টার
        let percent = document.getElementById('percent');
        let count = 0;
        let timer = setInterval(() => {
            count++;
            percent.innerText = count;
            if(count >= 100) clearInterval(timer);
        }, 45);

        // ক্লিক করলে আলোর স্পার্ক
        document.addEventListener('click', (e) => {
            let spark = document.createElement('div');
            spark.className = 'click-glow';
            spark.style.left = e.pageX + 'px';
            spark.style.top = e.pageY + 'px';
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 500);
        });
    </script>
</body>
</html>

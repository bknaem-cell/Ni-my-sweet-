<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ni My Sweet - 100K Year Legacy</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none;
        }

        /* ১. ওরিয়েন্টেশন লক (পোর্ট্রেট মোডে থাকলে এটি দেখাবে) */
        #orientation-blocker {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        .phone-animation {
            font-size: 50px; margin-bottom: 20px;
            animation: rotateDevice 2s infinite ease-in-out;
        }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* ২. মূল ইন্টারফেস (ল্যান্ডস্কেপ মোডের জন্য) */
        #main-ui {
            display: none; width: 100%; height: 100%;
            flex-direction: column; justify-content: center; align-items: center;
        }

        /* আপনার প্রিয় টপ ফিক্সড লোগো */
        #top-logo {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px; background: rgba(255,255,255,0.03);
            border-radius: 50%; border: 1.5px solid rgba(0,255,255,0.2);
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            box-shadow: 0 0 15px rgba(0,255,255,0.1);
        }

        /* সিস্টেম নাম - স্ক্রিনশট অনুযায়ী মাঝখানে */
        .brand-title {
            font-size: clamp(35px, 11vw, 60px);
            font-weight: 800; letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
            margin-bottom: 15px;
        }

        /* ফিউচারিস্টিক নিয়ন লোডিং বার */
        .loading-container {
            width: 80%; max-width: 400px; height: 1.5px;
            background: rgba(255,255,255,0.05); position: relative;
        }

        .loading-fill {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #fff, #00ffff);
            box-shadow: 0 0 20px #00ffff;
            transition: width 0.1s linear;
        }

        .ai-status {
            margin-top: 30px; font-size: 10px; color: #00ffff;
            letter-spacing: 5px; font-weight: 900;
            text-transform: uppercase;
        }
    </style>
</head>
<body onclick="requestFS()">

    <div id="orientation-blocker">
        <div class="phone-animation">📱</div>
        <p style="letter-spacing: 3px;">ROTATE FOR LEGACY EXPERIENCE</p>
    </div>

    <div id="main-ui">
        <div id="top-logo">🔄</div>
        <div class="brand-title">Ni My Sweet</div>
        <div class="loading-container">
            <div class="loading-fill" id="bar"></div>
        </div>
        <div id="status" class="ai-status">SYSTEM STANDBY</div>
    </div>

    <script>
        function checkMode() {
            const blocker = document.getElementById('orientation-blocker');
            const ui = document.getElementById('main-ui');
            if (window.innerWidth > window.innerHeight) {
                blocker.style.display = 'none';
                ui.style.display = 'flex';
                runSystem();
            } else {
                blocker.style.display = 'flex';
                ui.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkMode);
        window.addEventListener('load', checkMode);

        function requestFS() {
            let d = document.documentElement;
            if (d.requestFullscreen) d.requestFullscreen();
            else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
        }

        let isRunning = false;
        function runSystem() {
            if(isRunning) return;
            isRunning = true;
            
            let p = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            
            const timer = setInterval(() => {
                p++;
                bar.style.width = p + '%';
                if(p == 20) status.innerText = "LINKING NEURAL NET...";
                if(p == 60) status.innerText = "SYNCING GLOBAL SERVERS...";
                if(p >= 100) {
                    clearInterval(timer);
                    status.innerText = "SYSTEM ACTIVE";
                    status.style.color = "#00ff00";
                }
            }, 40);
        }
    </script>
</body>
</html>

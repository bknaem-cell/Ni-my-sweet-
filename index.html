<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>নাঈম ইব্রাহিম - ডিজিটাল ইকোসিস্টেম</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f4f7f6; }

        /* ফুল স্ক্রিন ম্যাপ */
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* স্মার্ট টপ কন্ট্রোল */
        .top-nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px; border-radius: 50px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #28a745;
        }

        .user-rank { color: #28a745; font-weight: bold; font-size: 14px; }
        .system-code { color: #555; font-size: 12px; }

        /* নিচের চাবিকাঠি মেনু (ফুল স্ক্রিন স্লাইডিং কার্ড) */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #fff; z-index: 1000; border-radius: 30px 30px 0 0;
            padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .drag-handle { width: 50px; height: 5px; background: #ddd; border-radius: 10px; margin: 0 auto 15px; }

        .service-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 10px;
        }

        .service-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; border-radius: 15px; background: #f8fcf9; border: 1px solid #e1eee3;
            cursor: pointer; transition: 0.2s;
        }

        .service-box:hover { background: #e8f5e9; transform: translateY(-3px); }
        .service-box span { font-size: 24px; margin-bottom: 5px; }
        .service-box p { font-size: 11px; font-weight: 600; color: #333; }

        /* স্ট্যাটাস ইন্ডিকেটর */
        .live-status {
            margin-top: 15px; font-size: 12px; color: #666;
            display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        .dot { height: 8px; width: 8px; background-color: #28a745; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body onload="loadSystem()">

    <div class="top-nav">
        <div class="user-rank" id="userTitle">আইডি: ১ (নাঈম ইব্রাহিম)</div>
        <div class="system-code">নাঈম ১৮ | সিস্টেম অনলাইন</div>
    </div>

    <div id="map"></div>

    <div class="bottom-panel">
        <div class="drag-handle"></div>
        <h3 style="font-size: 16px; margin-bottom: 15px; color: #2d5a27;">জীবনযাত্রার চাবিকাঠি</h3>
        
        <div class="service-grid">
            <div class="service-box" onclick="action('খাবার')"><span>🍱</span><p>খাবার</p></div>
            <div class="service-box" onclick="action('ডিজাইন')"><span>🏗️</span><p>ডিজাইন</p></div>
            <div class="service-box" onclick="action('চাকরি')"><span>💼</span><p>চাকরি</p></div>
            <div class="service-box" onclick="action('বাজার')"><span>🛒</span><p>বাজার</p></div>
        </div>

        <div class="live-status">
            <span class="dot"></span> আপনার বাড়ির উন্নয়ন কার্যক্রম চলছে...
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        const centerPoint = [23.8103, 90.4125];

        function loadSystem() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(centerPoint, 15);
            
            // সুন্দর ও উজ্জ্বল ম্যাপ স্টাইল
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // মেইন সেন্টার মার্কার
            L.marker(centerPoint).addTo(map).bindPopup("<b>প্রধান কেন্দ্র: নাঈম ইব্রাহিম</b>").openPopup();

            // ম্যাপে ক্লিক করলে নতুন লোকেশন ও দূরত্ব দেখাবে
            map.on('click', function(e) {
                let d = (map.distance(e.latlng, centerPoint) / 1000).toFixed(2);
                L.marker(e.latlng).addTo(map)
                    .bindPopup(`<b>নতুন ইউজার সাইট</b><br>কেন্দ্র থেকে দূরত্ব: ${d} কিমি`).openPopup();
            });
        }

        function action(type) {
            alert(type + " মেনু ওপেন হচ্ছে... এখান থেকে আপনি আপনার বাড়ির জন্য " + type + " নিয়ন্ত্রণ করতে পারবেন।");
        }
    </script>
</body>
</html>

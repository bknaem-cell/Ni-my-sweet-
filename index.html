    <title>TdV - ১ কিলো গেম সিস্টেম</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* আপনার ১ কিলো এরিয়ার থ্রি-ডি ভিউ (ব্যাকগ্রাউন্ড) */
        #game-canvas {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            z-index: -1;
        }

        /* ভাসমান গ্লাস বাটন ও নিওন আলোর দাগ */
        .glass-ui {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            position: absolute;
            transition: 0.3s;
            cursor: pointer;
        }

        .glass-ui:hover {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            border: 1px solid #00ffff;
        }

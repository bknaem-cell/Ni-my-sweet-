<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NI MY SWEET - Python Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            /* স্যামসাং স্টাইল ক্লিন ফন্ট */
            font-family: 'SamsungOne', 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
        }

        .edge-border {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 9999;
            box-sizing: border-box;
            border: 0.8px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }

        .task-complete-glow {
            border: 1.5px solid rgba(0, 255, 255, 0.7) !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .main-content { text-align: center; width: 85%; }

        /* টেক্সট স্পেসিং স্যামসাং স্টাইলে ফিক্স করা */
        .brand {
            color: #ffffff; 
            font-size: 30px; 
            font-weight: 800; 
            margin-bottom: 20px;
            letter-spacing: 3px; /* অতিরিক্ত ফাঁকা কমানো হয়েছে */
            text-transform: uppercase;
        }

        .bar-container { 
            position: relative; height: 18px; width: 80%; 
            margin: 0 auto; background: rgba(255, 255, 255, 0.05); 
            border-radius: 10px; overflow: hidden;
        }

        .bar-fill { height: 100%; width: 0%; background: #ffffff; }

        .percent-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff; mix-blend-mode: difference;
            font-size: 10px; font-weight: bold;
        }
    </style>
</head>
<body onclick="activateLandscape()">

    <div id="glow-border" class="edge-border"></div>

    <div class="main-content">
        <div class="brand">NI MY SWEET</div>
        <div class="bar-container">
            <div class="percent-text" id="p-val">0%</div>
            <div class="bar-fill" id="p-bar"></div>
        </div>
    </div>

    <script>
        async function activateLandscape() {
            let el = document.documentElement;
            // ফুলস্ক্রিন ও ল্যান্ডস্কেপ ফিক্স
            if (el.requestFullscreen) {
                await el.requestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
                try {
                    await screen.orientation.lock('landscape');
                } catch (e) {
                    console.log("Orientation lock failed");
                }
            }
        }

        let progress = 0;
        const pBar = document.getElementById('p-bar');
        const pVal = document.getElementById('p-val');
        const border = document.getElementById('glow-border');

        const loading = setInterval(() => {
            progress += 1;
            pBar.style.width = progress + "%";
            pVal.innerText = progress + "%";
            if (progress >= 100) {
                clearInterval(loading);
                border.classList.add('task-complete-glow');
            }
        }, 40);
    </script>
</body>
</html>

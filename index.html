<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>TdV App Interface</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050505; color: white; font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* ব্যাকগ্রাউন্ড লেয়ার (আপনার ১০ কিলো স্কয়ার ভিউ) */
        .app-bg {
            position: fixed; width: 100%; height: 100%;
            background: linear-gradient(45deg, #0f2027, #203a43, #2c5364);
            z-index: -1;
        }

        /* ভাসমান গ্লাস বাটন স্টাইল (আপনার নিওন আলোর দাগ সহ) */
        .app-button {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15); /* আপনার কাঙ্ক্ষিত আলোর দাগ */
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: 0.3s;
        }

        .app-button:active { transform: scale(0.95); box-shadow: 0 0 25px rgba(0, 255, 255, 0.5); }

        /* আপনার স্কেচ অনুযায়ী বাটন পজিশন */
        .btn-11 { top: 40px; left: 20px; width: 110px; height: 55px; }
        .btn-13 { top: 110px; left: 20px; width: 110px; height: 55px; }
        .btn-12 { bottom: 100px; left: 20px; width: 110px; height: 55px; }
        .btn-14 { bottom: 30px; left: 20px; width: 110px; height: 55px; }

        /* ক্যামেরার পাশের ম্যাপ */
        .map-circle {
            top: 20px; left: 45%; width: 85px; height: 85px;
            border-radius: 50%; border: 2.5px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
        }

        /* ভয়েস কমান্ড বার (আপনার লাল দাগ দেওয়া জায়গা) */
        .voice-bar {
            bottom: 25px; left: 25%; width: 50%; height: 65px;
            border: 1.5px solid #ff3131; /* আপনার লাল দাগের হুবহু কালার */
        }

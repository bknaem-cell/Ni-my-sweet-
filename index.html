<div class="remote-access" style="position:fixed; bottom:100px; left:20px; z-index:1000;">
    <button onclick="remoteDesign()" style="background:#007bff; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,123,255,0.3);">
        🌍 দূরবর্তী অবস্থান থেকে নিয়ন্ত্রণ (Remote Access)
    </button>
</div>

<script>
    function remoteDesign() {
        let location = prompt("আপনি এখন কোথায় আছেন? (যেমন: ঢাকা/লন্ডন/দুবাই)");
        if(location) {
            alert("সফলভাবে সংযুক্ত! আপনি এখন " + location + " থেকে আপনার বাড়ির উন্নয়ন তদারকি করছেন। আপনার জন্য নতুন কাজের অ্যাসাইনমেন্ট পাঠানো হচ্ছে।");
        }
    }

    // ম্যাপে ইউজারের বাড়ির তথ্যে চাকরির স্ট্যাটাস যোগ করা
    function addWorkStatus(name) {
        return `
            <div style="text-align:left;">
                <b>${name}</b><br>
                🏠 স্থিতি: পাবনা (নিজ বাড়ি)<br>
                💼 বর্তমান কাজ: অনলাইন প্রজেক্ট ম্যানেজার<br>
                <span style="color:blue;">● দূরে যাওয়ার প্রয়োজন নেই, কাজ বাড়ি থেকেই চলছে।</span>
            </div>
        `;
    }
</script>

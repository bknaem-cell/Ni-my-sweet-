<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TDV - Virtual World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        /* গেম ম্যাপ ব্যাকগ্রাউন্ড */
        #game-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a1f14 0%, #050a12 100%);
            background-image: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1;
        }

        /* আপনার স্কেচ অনুযায়ী টপ বার (ID, Level, Balance) */
        .top-ui {
            position: absolute; top: 20px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; z-index: 10;
        }
        .user-info {
            background: rgba(0, 255, 65, 0.1); border: 1px solid #00ff41;
            padding: 8px 15px; border-radius: 10px; color: #00ff41; backdrop-filter: blur(5px);
        }
        .balance-box {
            background: rgba(0, 255, 65, 0.1); border: 1px solid #00ff41;
            padding: 8px 15px; border-radius: 10px; color: #fff; text-align: right;
        }

        /* স্কেচের মতো সাইড বাটন (ভাসমান) */
        .side-controls {
            position: absolute; top: 100px; right: 15px; display: flex; flex-direction: column; gap: 15px; z-index: 10;
        }
        .circle-btn {
            width: 50px; height: 50px; background: rgba(0,0,0,0.8); border: 2px solid #00ff41;
            border-radius: 50%; color: #00ff41; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        /* নিচের মেইন কন্ট্রোল প্যানেল (আপনার স্কেচের বাটনগুলো) */
        .bottom-ui {
            position: absolute; bottom: 30px; left: 15px; right: 15px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; z-index: 10;
        }
        .action-card {
            background: rgba(0, 0, 0, 0.85); border: 1.5px solid #00ff41;
            padding: 12px 5px; border-radius: 12px; text-align: center;
            color: #00ff41; cursor: pointer; transition: 0.3s;
        }
        .action-card i { font-size: 22px; display: block; margin-bottom: 5px; }
        .action-card span { font-size: 10px; font-weight: bold; }

        /* লোগো অ্যানিমেশন (TDV) */
        .tdv-logo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 50px; font-weight: bold; color: rgba(0, 255, 65, 0.05);
            letter-spacing: 10px; z-index: 2; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-canvas"></div>
    <div class="tdv-logo">TDV</div>

    <div class="top-ui">
        <div class="user-info">
            <div style="font-size: 14px; font-weight: bold;">নাঈম ইব্রাহিম</div>
            <div style="font-size: 9px; opacity: 0.8;">ID: BD-ZERO-01 | LEVEL 1</div>
        </div>
        <div class="balance-box">
            <div style="font-size: 10px; opacity: 0.7;">ব্যালেন্স</div>
            <div style="font-size: 18px; color: #00ff41; font-weight: bold;">৳ ০.০০</div>
        </div>
    </div>

    <div class="side-controls">
        <div class="circle-btn" onclick="alert('কুইক স্ক্যান')">🔍</div>
        <div class="circle-btn" onclick="alert('মেসেজ বক্স')">📩</div>
    </div>

    <div class="bottom-ui">
        <div class="action-card" onclick="alert('বাড়ি নির্মাণের জোন')"><i>🏠</i><span>বিল্ডিং</span></div>
        <div class="action-card" onclick="alert('দোকান বা মার্কেট')"><i>🏪</i><span>শপ মোড</span></div>
        <div class="action-card" onclick="alert('কুরিয়ার ও ডেলিভারি')"><i>🛵</i><span>কুরিয়ার</span></div>
        <div class="action-card" onclick="alert('সিস্টেম সেটিংস')"><i>⚙️</i><span>সেটিংস</span></div>
    </div>

</body>
</html>

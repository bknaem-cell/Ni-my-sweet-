<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ni My Sweet - Advanced Legacy</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace; color: white;
            user-select: none;
        }

        /* ১. টপ লোগো - আপনার পছন্দের জায়গা */
        #fixed-logo {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px; background: rgba(255,255,255,0.03);
            border-radius: 50%; border: 1px solid rgba(0,255,255,0.3);
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            z-index: 1000;
        }

        /* ২. সেন্ট্রাল সিস্টেম */
        .core-interface {
            text-align: center; width: 85%; max-width: 500px;
            display: flex; flex-direction: column; align-items: center;
        }

        .system-name {
            font-size: clamp(30px, 10vw, 60px);
            font-weight: 900; margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            letter-spacing: 5px; color: #fff;
            animation: pulse-text 3s infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }

        /* লোডিং বার ও পার্সেন্টেজ */
        .loading-section { width: 100%; margin: 20px 0; }
        
        .track {
            width: 100%; height: 2px; background: #111;
            position: relative; overflow: hidden;
        }

        .fill {
            height: 100%; width: 0%; background: #00ffff;
            box-shadow: 0 0 15px #00ffff; transition: width 0.1s;
        }

        .pct-text {
            font-size: 14px; color: #00ffff; margin-top: 10px;
            font-weight: bold; letter-spacing: 2px;
        }

        /* ৩. ডেটা স্ট্রিম (নতুন ফিউচার) */
        .data-stream {
            height: 40px; font-size: 9px; color: #333;
            overflow: hidden; margin-top: 15px; width: 100%;
            text-align: left; opacity: 0.6;
        }

        .status-msg {
            margin-top: 20px; color: #fff; font-size: 10px;
            letter-spacing: 3px; font-weight: bold; text-transform: uppercase;
        }
    </style>
</head>
<body onclick="launchMasterSystem()">

    <div id="fixed-logo">🔄</div>

    <div class="core-interface">
        <div class="system-name">Ni My Sweet</div>
        
        <div class="loading-section">
            <div class="track"><div class="fill" id="bar"></div></div>
            <div class="pct-text" id="pct">0%</div>
        </div>

        <div id="status" class="status-msg">SYSTEM STANDBY</div>

        <div class="data-stream" id="stream"></div>
    </div>

    <script>
        let running = false;
        const codes = [
            "CONNECTING TO GLOBAL_SERVER...", "ENCRYPTING DATA_PACKETS...",
            "SYNCING NEURAL_LINK...", "LOADING ASSETS...", "OPTIMIZING UI...",
            "ESTABLISHING LEGACY_V1.0..."
        ];

        function launchMasterSystem() {
            if (running) return;
            running = true;

            // ফুল স্ক্রিন
            let d = document.documentElement;
            if (d.requestFullscreen) d.requestFullscreen();

            let p = 0;
            const bar = document.getElementById('bar');
            const pct = document.getElementById('pct');
            const status = document.getElementById('status');
            const stream = document.getElementById('stream');
            
            const timer = setInterval(() => {
                p++;
                bar.style.width = p + '%';
                pct.innerText = p + '%';
                
                // ডেটা স্ট্রিম আপডেট
                if(p % 15 == 0) {
                    let randomCode = codes[Math.floor(Math.random()*codes.length)];
                    stream.innerHTML += `<div>> ${randomCode}</div>`;
                    stream.scrollTop = stream.scrollHeight;
                }

                if(p == 20) status.innerText = "LINKING HARDWARE...";
                if(p == 50) status.innerText = "BYPASSING FIREWALL...";
                if(p == 85) status.innerText = "FINALIZING SYSTEM...";
                
                if (p >= 100) {
                    clearInterval(timer);
                    status.innerText = "SYSTEM ACTIVE";
                    status.style.color = "#00ff00";
                }
            }, 50);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাঈম ১৮ - ভার্চুয়াল সিটি বিল্ডার</title>
    <style>
        body { margin: 0; background: #0b1a0e; color: #fff; font-family: sans-serif; overflow: hidden; }
        #game-map { 
            width: 2000px; height: 2000px; 
            background-color: #1e3d1a;
            background-image: radial-gradient(#2d5a27 2px, transparent 2px);
            background-size: 50px 50px;
            position: relative; cursor: crosshair;
        }
        .building { 
            position: absolute; width: 60px; height: 60px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: move; transition: transform 0.2s;
        }
        .building:hover { transform: scale(1.2); }
        .ui-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 15px; border-radius: 50px;
            display: flex; gap: 15px; border: 2px solid #ffd700; z-index: 1000;
        }
        .item { font-size: 25px; cursor: pointer; padding: 10px; border-radius: 50%; background: #222; }
        .item:hover { background: #444; }
    </style>
</head>
<body>

    <div id="game-map" onclick="placeBuilding(event)">
        </div>

    <div class="ui-dock">
        <div class="item" onclick="selectItem('🏡')">🏡</div>
        <div class="item" onclick="selectItem('🚜')">🚜</div>
        <div class="item" onclick="selectItem('🌳')">🌳</div>
        <div class="item" onclick="selectItem('🏭')">🏭</div>
        <div style="color: gold; padding-top: 10px;">আইটেম বেছে নিন</div>
    </div>

    <script>
        let selectedItem = '🏡';

        function selectItem(item) {
            selectedItem = item;
            alert(item + " সিলেক্ট হয়েছে! এখন ম্যাপের ফাঁকা জায়গায় ক্লিক করুন।");
        }

        function placeBuilding(e) {
            const map = document.getElementById('game-map');
            const building = document.createElement('div');
            building.className = 'building';
            // মাউস বা টাচ পয়েন্ট অনুযায়ী পজিশন
            building.style.left = (e.pageX - 30) + 'px';
            building.style.top = (e.pageY - 30) + 'px';
            building.innerText = selectedItem;
            
            // বাড়িটি ড্র্যাগ করার অপশন (ভবিষ্যতের জন্য)
            building.onclick = function(event) {
                event.stopPropagation();
                if(confirm("এই বাড়িটি কি সরাতে বা ডিলিট করতে চান?")) {
                    this.remove();
                }
            };

            map.appendChild(building);
        }
    </script>
</body>
</html>

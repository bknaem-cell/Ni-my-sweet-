<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDV Advanced System</title>
    <script src="//unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #0b0e14; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* প্রিমিয়াম লেয়ার */
        .overlay { position: relative; z-index: 2; padding: 20px; pointer-events: none; }
        
        /* আপনার সেই নীল আভার প্যানেল */
        .panel { background: rgba(11, 14, 20, 0.7); border: 1px solid #30363d; padding: 20px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; color: #58a6ff; font-size: 24px; }
        
        .nav-menu { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; background: #238636; border: none; border-radius: 5px; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="overlay">
    <div class="panel header">
        <h1>নাঈম ইব্রাহিম | TDV System</h1>
        <div>🪙 NJ Gold: 10,0000</div>
    </div>
</div>

<div class="nav-menu">
    <button class="btn">🏗️ বিল্ডার</button>
    <button class="btn">🛒 Lovee Market</button>
</div>

<script>
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true)
      .atmosphereColor('#58a6ff');

    world.controls().autoRotate = true;
</script>

</body>
</html>

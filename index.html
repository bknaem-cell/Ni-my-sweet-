<style>
    /* মোবাইল বাঁকা বা সোজা—সব অবস্থায় ফুল স্ক্রিন রাখার জন্য */
    html, body { 
        width: 100%; 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        position: fixed; /* স্ক্রিন যেন নড়াচড়া না করে */
    }

    #map { 
        width: 100vw; 
        height: 100vh; 
        display: block;
    }

    /* মোবাইল বাঁকা (Landscape) করলে নিচের মেনু যেন ছোট হয়ে মানিয়ে নেয় */
    @media screen and (orientation: landscape) {
        .bottom-panel {
            padding: 10px;
            max-height: 40%; /* স্ক্রিন খুব বেশি ব্লক করবে না */
            overflow-y: auto;
        }
        .service-grid {
            gap: 5px;
        }
    }
</script>

<script>
    // মোবাইল রোটেট করলে ম্যাপ যেন অটোমেটিক সাইজ ঠিক করে নেয়
    window.addEventListener("orientationchange", function() {
        setTimeout(function() {
            map.invalidateSize(); // ম্যাপের সাইজ অটো-অ্যাডজাস্ট করবে
        }, 200);
    });
            </script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE DIGITAL VILLA ECONOMY</title>
    
    <style>
        /* পুরো বডি যেন অটোমেটিক না ঘোরে তার জন্য ফিক্সড সেটিংস */
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            position: fixed; /* স্ক্রিন স্ক্রল বা নড়াচড়া বন্ধ করতে */
        }

        /* ক্যাটাগরি গ্রিড যেন সবসময় ২ কলামে থাকে */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
        }

        /* বড় স্ক্রিন বা বাঁকা করলেও যেন লেআউট ঠিক থাকে */
        @media screen and (orientation: landscape) {
            body {
                transform: none;
            }
        }
    </style>
</head>

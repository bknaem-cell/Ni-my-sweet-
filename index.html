<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDV Advanced Green System</title>
    <script src="//unpkg.com/globe.gl"></script>
    <style>
        /* আপনার সেই প্রিয় ২০ বছর পরের সবুজ ফিউচারিস্টিক থিম */
        body { margin: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; pointer-events: none; }
        .glass-panel { background: rgba(0, 40, 0, 0.7); border: 1px solid #00ff41; border-radius: 10px; padding: 15px; box-shadow: 0 0 15px #00ff41; pointer-events: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        
        /* স্কেচ ৪৩১৪ ও ৪৩১২ অনুযায়ী PIN কন্ট্রোল */
        .center-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .scanner-circle { width: 160px; height: 160px; border: 2px dashed #00ff41; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: rgba(0, 255, 65, 0.05); animation: spin 10s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .pin-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; text-shadow: 0 0 15px #00ff41; }

        .footer { display: flex; justify-content: center; gap: 15px; }
        .neon-btn { background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; pointer-events: auto; }
        .neon-btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }
        #globeViz { position: absolute; inset: 0; z-index: 1; filter: hue-rotate(90deg) brightness(0.7); }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div id="ui-layer">
    <div class="glass-panel header">
        <div>
            <h2 style="margin:0;">নাঈম ইব্রাহিম | TDV SYSTEM</h2>
            <small>STATUS: ENCRYPTED ACCESS</small>
        </div>
        <div style="color: #ccff00; font-size: 1.2em;">🪙 NJ Gold: 10,0000</div>
    </div>

    <div class="center-ui">
        <div class="scanner-circle"></div>
        <div class="pin-label">
            <h1 style="margin:0;">TDV</h1>
            <p style="margin:0; font-size: 14px;">PIN 30</p>
            <button class="neon-btn" style="margin-top: 10px; font-size: 10px;">ENTER</button>
        </div>
    </div>

    <div class="footer">
        <button class="neon-btn">🏗️ বিল্ডার</button>
        <button class="neon-btn">🛒 Lovee Market</button>
        <button class="neon-btn">🚀 কুরিয়ার</button>
    </div>
</div>

<script>
    const world = Globe()(document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true)
      .atmosphereColor('#00ff41');

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    world.pointOfView({ lat: 23.5, lng: 90.3, alt: 2.5 });
</script>

</body>
</html>

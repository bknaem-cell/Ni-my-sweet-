<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম সিস্টেম আপডেট - নাঈম ইব্রাহিম</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        /* আপডেটের নাম */
        .update-title {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #58a6ff;
        }

        /* লোডিং বক্স/বার */
        .progress-box {
            width: 100%;
            background-color: #21262d;
            border-radius: 10px;
            height: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1f6feb, #58a6ff);
            box-shadow: 0 0 10px #58a6ff;
            animation: fillProgress 5s linear forwards;
        }

        /* পার্সেন্টেজ টেক্সট */
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
        }

        /* বক্সের নিচের ছোট লেখা */
        .small-footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #8b949e;
            font-style: italic;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="update-title">সিস্টেম প্রিমিয়াম কনফিগারেশন আপডেট</div>

        <div class="progress-box">
            <div class="progress-fill" id="fill"></div>
        </div>

        <div class="status-row">
            <span id="loading-status">লোডিং হচ্ছে...</span>
            <span id="percentage">০%</span>
        </div>

        <div class="small-footer-text">
            প্যাকেজ ভেরিফাই করা হচ্ছে। দয়া করে অপেক্ষা করুন, এটি আপনার সিস্টেমকে আরও উন্নত করবে।
        </div>
    </div>

    <script>
        // পার্সেন্টেজ সংখ্যা বাড়ানোর জন্য ছোট স্ক্রিপ্ট
        let percentElem = document.getElementById('percentage');
        let count = 0;
        let interval = setInterval(() => {
            count++;
            percentElem.innerText = count + '%';
            if (count >= 100) {
                clearInterval(interval);
                document.getElementById('loading-status').innerText = 'আপডেট সম্পূর্ণ!';
            }
        }, 50); // ৫ সেকেন্ডে ১০০% হবে
    </script>

</body>
</html>

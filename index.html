<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NI-TEN: ১০ কিলো স্কয়ার</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #00f3ff;
            font-family: sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ইউজার আইডি কার্ড */
        .id-card {
            position: fixed;
            top: env(safe-area-inset-top, 10px);
            right: 10px;
            padding: 8px;
            border: 1px solid #39ff14;
            background: rgba(0,0,0,0.8);
            font-size: 10px;
            z-index: 100;
        }

        /* প্রধান জগত - যেখানে ঘর ও মাটি থাকবে */
        .game-world {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .house {
            width: 120px;
            height: 90px;
            border: 1px solid #00f3ff;
            background: repeating-linear-gradient(0deg, rgba(0,243,255,0.05) 0px, rgba(0,243,255,0.05) 1px, transparent 1px, transparent 10px);
        }

        .ground {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.3);
            margin: 10px 0;
        }

        .roots {
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, #39ff14, transparent);
        }

        /* কন্ট্রোল বাটন নিচে ফিক্সড */
        .controls {
            padding-bottom: env(safe-area-inset-bottom, 20px);
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.5);
            width: 100%;
        }

        .btn {
            border: 1px solid #00f3ff;
            padding: 8px;
            font-size: 10px;
            color: #00f3ff;
            background: none;
        }
    </style>
</head>
<body>
    <div class="id-card">
        <p style="color:#39ff14">NAME: নাঈম ইব্রাহিম</p>
        <p>ID: নাঈম 18</p>
        <p>STATUS: প্রজেক্ট লিডার</p>
    </div>

    <div class="game-world">
        <div class="house"></div>
        <div class="ground"></div>
        <div class="roots"></div>
        <p style="font-size: 9px; color:#39ff14">ROOTS ACTIVE</p>
    </div>

    <div class="controls">
        <button class="btn">ইঞ্জিনিয়ারিং</button>
        <button class="btn">কৃষি মিশন</button>
        <button class="btn">লিগ্যাসি</button>
    </div>
</body>
</html>
